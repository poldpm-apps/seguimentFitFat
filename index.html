  <meta name="theme-color" content="#e8eef0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

    if ('serviceWorker' in navigator) {
      addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('El cos: no s\'ha pogut registrar el treballador de servei', e);
        });
      });
    }
  </script>
  <style>
/* =========================================================================
   EL COS — sistema visual: «el pols de les setmanes»

   Un catàleg sobre un camp pàl·lid. Cada control setmanal és una carena i
   dotze setmanes apilades són el pols del cos: les velles, clares i al
   darrere; la d'ara, fosca i al davant. Aquesta regla —el que és vell és
   clar, el que és d'ara és fosc— és la paleta sencera, i és la de la icona.

   REGLES, NO TARGETES. L'estructura la fan els filets i l'alineació. No hi
   ha caixes arrodonides ni ombres de decoració: si alguna cosa necessita
   separar-se, es separa amb una línia.

   UNA SOLA FAMÍLIA, TRES PESOS. Hanken Grotesk, amb xifres tabulars, perquè
   tots els números s'alineïn en columna com en un registre. Les etiquetes
   van en versaletes espaiades («gravat»), com el número d'un catàleg.

   UN SOL COLOR D'AVÍS. L'ocre vol dir «hi ha alguna cosa a corregir o a
   vigilar»: el veredicte que ho diu, un error, una fila dubtosa d'una captura
   i el botó del que no es pot desfer. Sempre amb text: el color sol no diu
   res.
   ========================================================================= */

@font-face {
  font-family: "Hanken Grotesk";
  src: url("fonts/hanken-grotesk.woff2") format("woff2");
  font-weight: 400 600; font-style: normal; font-display: swap;
}

:root {
  /* --- el camp i la tinta --- */
  --camp:      #e8eef0;   /* el camp sense imprimir: el fons de la icona */
  --camp-alt:  #f3f6f7;   /* un pas més clar: on es posa el dit */
  --blanc:     #fbfcfc;   /* el que està triat, i els camps on s'escriu */
  --tinta:     #0d191e;
  --tinta-2:   #3d5560;   /* text secundari: 6,7:1 sobre el camp */
  --tinta-3:   #5b717a;   /* el que menys diu: 4,6:1 sobre el camp */

  /* --- la rampa del temps: de vell i clar a ara i fosc --- */
  --t1: #bcced4;
  --t2: #7ab5c1;
  --t3: #1c8496;
  --t4: #054a57;

  /* --- filets --- */
  --fil:      #9fb4bb;    /* la regla de cada fila */
  --fil-fort: #0d191e;    /* la que obre una secció */

  /* --- l'únic avís --- */
  --ocre:       #85580f;  /* 5,2:1 sobre el camp */
  --ocre-fons:  #f4ead7;

  /* --- espai: una sola escala --- */
  --e1: 4px; --e2: 8px; --e3: 12px; --e4: 16px; --e5: 24px; --e6: 32px; --e7: 48px;

  /* --- moviment --- */
  --sortida: cubic-bezier(.23, 1, .32, 1);      /* el que entra */
  --calaix:  cubic-bezier(.32, .72, 0, 1);      /* el full que puja */

  --font: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --amplada: 680px;

  color-scheme: light;
}

/* ------------------------------------------------------------------ base */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--camp); color: var(--tinta);
  font-family: var(--font); font-size: 16px; line-height: 1.45;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, p, ul, ol, figure, blockquote { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--t4); outline-offset: 2px; }
::selection { background: var(--t1); }

.ic { width: 24px; height: 24px; display: block; flex: none; fill: none;
      stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ic-p { width: 18px; height: 18px; }
.ic-g { width: 40px; height: 40px; stroke-width: 1.3; }

/* --------------------------------------------------------------- lletra */
h1 { font-size: 30px; font-weight: 600; letter-spacing: -.015em; line-height: 1.1; }
h2 { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
     line-height: 1.3; color: var(--tinta); }

h1, .veredicte-v, .estat h2, .modal-cap h2 { text-wrap: balance; }
p, .menut { text-wrap: pretty; }

/* EL GRAVAT: l'etiqueta de catàleg. 12 px i prou, en versaletes espaiades.
   `.marge` és el nom que hi posen el marc i les peces comunes. */
.gravat, .marge {
  font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--tinta-2); line-height: 1.35;
}
.gravat.tinta { color: var(--tinta); }
.num-cat { color: var(--tinta); letter-spacing: .1em; }
.menut { font-size: 14px; color: var(--tinta-2); line-height: 1.45; }
.fluix { color: var(--tinta-2); }

/* --------------------------------------------------------------- pàgina */
#vista { min-height: 100dvh; }
.pagina {
  max-width: var(--amplada); margin: 0 auto;
  padding: 0 var(--e4) calc(var(--e7) + env(safe-area-inset-bottom));
}

/* LA SECCIÓ. Un filet fosc l'obre; a sota, el que hi hagi, sense caixa. */
.seccio { margin-top: var(--e6); }
.seccio-cap {
  display: flex; justify-content: space-between; align-items: baseline; gap: var(--e3);
  padding-bottom: 10px; border-bottom: 1px solid var(--fil-fort);
}
.fila-regla { border-bottom: 1px solid var(--fil); }

/* ------------------------------------------------------------ capçalera */
.capcalera { max-width: var(--amplada); margin: 0 auto;
             padding: calc(var(--e2) + env(safe-area-inset-top)) var(--e4) 0; }
.cap-fila { display: flex; align-items: center; gap: var(--e1); min-height: 56px; }
.cap-fila .btn-primari { margin-left: auto; }
.marca { display: inline-flex; align-items: center; gap: var(--e2); min-width: 0; }
.marca .ic { color: var(--t4); stroke-width: 1.5; }
.cap-titol { padding-top: var(--e3); }
.cap-titol p { margin-top: 6px; font-size: 15px; color: var(--tinta-2); }

/* ---------------------------------------------------------------- botons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--e2);
  min-height: 44px; padding: 0 var(--e4);
  border: 1px solid var(--tinta); background: transparent; color: var(--tinta);
  font-size: 15px; font-weight: 600; letter-spacing: .01em; line-height: 1.2;
  text-decoration: none; text-align: center; position: relative; user-select: none;
  transition: transform 140ms var(--sortida), background-color 160ms ease, color 160ms ease, border-color 160ms ease;
}
.btn .ic { width: 18px; height: 18px; }
.btn:active { transform: scale(.97); }
.btn-primari { background: var(--tinta); color: var(--blanc); }
.btn-secundari { background: transparent; }
.btn-fantasma { border-color: transparent; }
.btn-icona { width: 44px; min-width: 44px; padding: 0; border-color: transparent; }
.btn-icona .ic { width: 22px; height: 22px; }
.btn-ple { width: 100%; }
.btn-menut { min-height: 44px; padding: 0 var(--e3); font-size: 14px; }
.btn-perill { background: var(--ocre); border-color: var(--ocre); color: #fff; }
.btn:disabled, .btn[aria-disabled="true"] {
  border-color: var(--fil); color: var(--tinta-3); background: transparent; cursor: not-allowed;
}
.btn-primari:disabled { background: var(--t1); border-color: var(--t1); color: var(--tinta-2); }
.btn:disabled:active { transform: none; }
.btn-icona:disabled, .btn-fantasma:disabled { border-color: transparent; }
@media (hover: hover) and (pointer: fine) {
  .btn:hover { background: var(--camp-alt); }
  .btn-primari:hover { background: #1f2f36; }
  .btn-perill:hover { background: #6f490c; }
  .btn-fantasma:hover, .btn-icona:hover { background: rgba(13, 25, 30, .06); }
}
/* ESPERANT. El botó diu que l'ha sentit: una ratlla corre per sota mentre
   s'espera el servidor. No s'hi pot tornar a prémer. */
.btn[data-carregant="1"] { pointer-events: none; color: transparent; }
.btn[data-carregant="1"]::after {
  content: ""; position: absolute; left: 25%; right: 25%; top: calc(50% - 1px); height: 2px;
  background: currentColor; color: var(--tinta);
  animation: espera 900ms var(--calaix) infinite alternate;
}
.btn-primari[data-carregant="1"]::after { color: var(--blanc); }
@keyframes espera { from { transform: scaleX(.15); } to { transform: scaleX(1); } }

/* L'ENLLAÇ: per anar a un altre lloc, no per fer res. */
.enllac {
  display: inline-flex; align-items: center; gap: var(--e1); min-height: 44px;
  font-size: 15px; font-weight: 600; color: var(--tinta); text-underline-offset: 3px;
}
.enllac .ic { width: 16px; height: 16px; }
@media (hover: hover) and (pointer: fine) { .enllac:hover { text-decoration: underline; } }

/* ----------------------------------------------------------- formularis */
.formulari, .form-ajustos { display: grid; gap: 22px; }
.camp { display: grid; gap: var(--e2); }
.camp > label, .camp > span, .camp > legend {
  font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--tinta);
}
.entrada {
  width: 100%; min-height: 48px; padding: 10px 12px;
  border: 1px solid var(--fil); border-radius: 0; background: var(--blanc); color: var(--tinta);
  font-size: 17px;            /* menys de 16 i l'iPhone s'hi apropa sol */
  transition: border-color 160ms ease, box-shadow 160ms ease;
  -webkit-appearance: none; appearance: none;
}
textarea.entrada { min-height: 88px; resize: vertical; line-height: 1.45; }
input[type="date"].entrada { min-height: 48px; }
.entrada::placeholder { color: var(--tinta-3); }
.entrada:focus { outline: none; border-color: var(--t4); box-shadow: inset 0 0 0 1px var(--t4); }
.entrada:invalid:not(:placeholder-shown):not(:focus) { border-color: var(--ocre); }
.camp-fila { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--e3); }
.camp-fila.dos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.camp-mal, .camp .mal { font-size: 14px; font-weight: 600; color: var(--ocre); }
.camp-mal::before { content: "— "; }

/* TRIAR UNA DE TRES: una regla amb tres trams, i el triat s'omple de tinta. */
.tria-fila { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--tinta); }
.tria-bt {
  min-height: 44px; padding: 0 var(--e2); font-size: 15px; font-weight: 500;
  border-left: 1px solid var(--fil); transition: background-color 140ms ease, color 140ms ease;
}
.tria-bt:first-child { border-left: 0; }
.tria-bt[aria-pressed="true"] { background: var(--tinta); color: var(--blanc); font-weight: 600; }
@media (hover: hover) and (pointer: fine) { .tria-bt:not([aria-pressed="true"]):hover { background: var(--camp-alt); } }

.camp > label.check { font-size: 15px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--tinta); }
.check { display: flex; align-items: center; gap: var(--e3); min-height: 44px; font-size: 15px; cursor: pointer; }
.check input { width: 22px; height: 22px; margin: 0; accent-color: var(--t4); flex: none; }

/* --------------------------------------------------- el full que puja */
/* EL MODAL ÉS UN FULL QUE PUJA DES DE BAIX al mòbil, que és on hi ha el dit,
   i un full al mig a l'escriptori. Entra amb la corba del calaix i surt més
   de pressa del que entra. */
.fosc {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(13, 25, 30, .44); opacity: 0; pointer-events: none;
  transition: opacity 200ms ease;
}
.fosc[data-obert="1"] { opacity: 1; pointer-events: auto; }
.modal {
  width: 100%; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--camp); border-top: 1px solid var(--tinta);
  padding: 0 var(--e4) calc(var(--e5) + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform 300ms var(--calaix);
}
.fosc[data-obert="1"] .modal { transform: translateY(0); }
.fosc[data-obert="0"] .modal { transition-duration: 200ms; }
.modal-cap {
  position: sticky; top: 0; z-index: 1; background: var(--camp);
  display: flex; align-items: center; justify-content: space-between; gap: var(--e3);
  padding: var(--e4) 0 var(--e3); margin-bottom: var(--e4); border-bottom: 1px solid var(--fil-fort);
}
.modal-cap h2 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; text-transform: none; }
.modal-cap .btn-icona { margin-right: calc(-1 * var(--e2)); }
.modal > p + p, .modal > p + .formulari, .modal > p + .form-ajustos { margin-top: var(--e3); }
@media (min-width: 640px) {
  .fosc { align-items: center; padding: var(--e5); }
  .modal { max-width: 540px; max-height: 86dvh; border: 1px solid var(--tinta);
           transform: translateY(12px) scale(.985); opacity: 0;
           transition: transform 220ms var(--sortida), opacity 180ms ease; }
  .fosc[data-obert="1"] .modal { transform: none; opacity: 1; }
}

/* --------------------------------------------------- avisos de passada */
.brindis {
  position: fixed; left: 50%; bottom: calc(var(--e4) + env(safe-area-inset-bottom)); z-index: 60;
  display: flex; align-items: center; gap: var(--e2); max-width: min(92vw, 480px);
  min-height: 48px; padding: var(--e3) var(--e4);
  background: var(--tinta); color: var(--blanc); font-size: 15px; font-weight: 500;
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  transition: transform 260ms var(--sortida), opacity 200ms ease;
}
.brindis .ic { width: 18px; height: 18px; color: var(--t1); }
.brindis[data-visible="1"] { transform: translate(-50%, 0); opacity: 1; }
.brindis[data-to="error"] { background: var(--ocre); }
.brindis[data-to="error"] .ic { color: #fff; }

.sense-xarxa {
  position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: var(--e2);
  padding: var(--e2) var(--e4); background: var(--tinta); color: var(--blanc); font-size: 14px;
}
#pendents { background: var(--t4); }

/* QUINA VERSIÓ ÉS. Discreta, a baix, i fora del lector de pantalla. */
.marca-versio {
  position: fixed; right: var(--e2); bottom: calc(var(--e1) + env(safe-area-inset-bottom));
  font-size: 12px; color: var(--tinta-3); letter-spacing: .04em; pointer-events: none; z-index: 1;
}

/* ------------------------------------------------- estats de la pantalla */
.estat {
  display: grid; justify-items: start; gap: var(--e3);
  padding: var(--e6) 0; margin-top: var(--e4); border-top: 1px solid var(--fil-fort);
}
.estat .ic-g { color: var(--t3); }
.estat h2 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; text-transform: none; }
.estat p { font-size: 15px; color: var(--tinta-2); max-width: 34em; }
.estat .btn { margin-top: var(--e1); }

.avis {
  display: flex; gap: var(--e3); align-items: flex-start; padding: var(--e3) 0;
  border-top: 1px solid var(--ocre); border-bottom: 1px solid var(--ocre);
  color: var(--tinta); font-size: 15px;
}
.avis .ic { color: var(--ocre); width: 20px; height: 20px; margin-top: 1px; }
.avis strong { display: block; font-weight: 600; }

/* CARREGANT. Unes regles grises que bateguen poc: el mateix dibuix que tindrà
   la pàgina, sense dades. */
.marques { display: grid; gap: var(--e4); max-width: var(--amplada); margin: 0 auto; padding: var(--e6) var(--e4); }
.esquelet { background: var(--t1); opacity: .5; min-height: 14px; animation: batec 1.4s ease-in-out infinite; }
.marca-fantasma { height: 56px; }
.marca-fantasma:first-child { height: 120px; }
@keyframes batec { 50% { opacity: .25; } }

.targeta { padding: var(--e4) 0; border-bottom: 1px solid var(--fil); }

/* ------------------------------------------------------------- el visor */
.visor-cos { display: grid; gap: var(--e3); }
.visor-clau { display: none; }
.visor-peu, .vis-eix { display: flex; justify-content: space-between; gap: var(--e3); font-size: 14px; color: var(--tinta-2); }
.vis-text { font-size: 16px; line-height: 1.5; }
.vis-llista li { padding: var(--e3) 0; border-bottom: 1px solid var(--fil); font-size: 15px; }
.vis-taula { width: 100%; border-collapse: collapse; font-size: 14px; }
.vis-taula th, .vis-taula td { text-align: left; padding: var(--e2) var(--e2) var(--e2) 0; border-bottom: 1px solid var(--fil); }
.vis-taula th { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-2); }
.vis-taula-fora { font-size: 14px; color: var(--tinta-2); margin-top: var(--e2); }
.vis-barres { display: grid; gap: var(--e2); }
.vis-barra { display: grid; grid-template-columns: 7em 1fr auto; gap: var(--e2); align-items: center; font-size: 14px; }
.vis-barra-riu { height: 8px; background: var(--t1); }
.vis-barra-riu > span { display: block; height: 100%; background: var(--t4); }
.vis-linia, .vis-traç { fill: none; stroke: var(--t4); stroke-width: 1.4; }
.vis-punt { fill: var(--t2); }
.vis-ara { fill: var(--t4); }
.vis-marca { stroke: var(--fil); }

/* ================================================================= INICI */
.inici-marca { display: block; width: 200px; max-width: 60%; height: auto; margin-top: var(--e5); }
.inici-data { margin-top: var(--e5); }
.inici h1 { font-size: 40px; margin-top: var(--e5); }
.inici-lema { margin-top: var(--e2); font-size: 16px; color: var(--tinta-2); max-width: 30em; }

.portes { margin-top: var(--e6); border-top: 1px solid var(--fil-fort); }
.porta {
  width: 100%; display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: var(--e3);
  min-height: 80px; padding: var(--e4) 0; border-bottom: 1px solid var(--fil); text-align: left;
  transition: background-color 160ms ease;
}
.porta .ic { color: var(--t4); width: 28px; height: 28px; stroke-width: 1.4; }
.porta-nom { display: block; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.porta-que { display: block; margin-top: 2px; font-size: 14px; color: var(--tinta-2); }
.porta .fletxa { width: 20px; height: 20px; color: var(--tinta-2);
                 transition: transform 200ms var(--sortida); }
.porta:active { background: var(--camp-alt); }
@media (hover: hover) and (pointer: fine) {
  .porta:hover { background: var(--camp-alt); }
  .porta:hover .fletxa { transform: translateX(3px); color: var(--tinta); }
}
.cap-eines { display: flex; gap: var(--e1); margin-left: auto; }
.cap-eina { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--t4); }

.crida-avisos {
  display: grid; grid-template-columns: 24px 1fr; gap: var(--e3); margin-top: var(--e5);
  padding: var(--e4) 0; border-top: 1px solid var(--fil-fort);
}
.crida-avisos .ic { color: var(--t4); }
.crida-avisos b { display: block; font-weight: 600; font-size: 16px; }
.crida-avisos p { margin-top: var(--e1); font-size: 15px; color: var(--tinta-2); }
.crida-avisos .btn { margin-top: var(--e3); }

/* ============================================================= SEGUIMENT */
.reclam {
  display: grid; grid-template-columns: 1fr auto; gap: var(--e1) var(--e3); align-items: center;
  width: 100%; margin-top: var(--e5); padding: var(--e4) 0; text-align: left;
  border-top: 1px solid var(--fil-fort); border-bottom: 1px solid var(--fil);
}
.reclam .gravat { grid-column: 1 / -1; }
.reclam b { font-size: 17px; font-weight: 600; grid-column: 1; }
.reclam .menut { grid-column: 1; }
.reclam .btn { grid-column: 2; grid-row: 2 / 4; }

.veredicte { margin-top: var(--e6); }
.veredicte-v { font-size: 38px; font-weight: 600; letter-spacing: -.02em; line-height: 1.05; margin-top: var(--e2);
               text-transform: none; color: var(--tinta); }
.veredicte[data-mena="avis"] .veredicte-v { color: var(--ocre); }
.veredicte-nota { margin-top: var(--e2); font-size: 15px; font-weight: 600; color: var(--ocre); }

/* LA PILA DE CARENES. Una per control; la triada, davant i el doble de gruix. */
.pols { display: block; width: 100%; max-width: 480px; height: auto; margin-top: var(--e4); overflow: visible; }
.pols .r { fill: none; stroke-linejoin: round; stroke-linecap: round;
           transition: stroke-width 240ms var(--sortida), stroke 240ms ease; }
.pols .f { fill: var(--camp); }

      var d = new Date();
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    },
    suma: function (t, n) {
      var d = fmt.aData(t); d.setDate(d.getDate() + n);
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    },
    llarga: function (t) {
      var d = fmt.aData(t), m = MESOS[d.getMonth()];
      var prep = /^[aeiou]/.test(m) ? "d'" : 'de ';
      return DIES[d.getDay()] + ', ' + d.getDate() + ' ' + prep + m;
    },
    relativa: function (t) {
      var avui = fmt.avui();
      if (t === avui) return 'Avui';
      if (t === fmt.suma(avui, -1)) return 'Ahir';
      if (t === fmt.suma(avui, 1)) return 'Demà';
      var d = fmt.aData(t);
      return DIES_C[d.getDay()] + ' ' + d.getDate() + ' ' + MESOS[d.getMonth()].slice(0, 3) + '.';
    },
    diaNumero: function (t) { return fmt.aData(t).getDate(); },

    /* Amb coma i sense decimals inútils: «5,3» i «4», no «5.3» i «4.0». */
    decimal: function (n) {
      var v = Math.round((Number(n) || 0) * 10) / 10;
      return (v % 1 === 0 ? String(v) : v.toFixed(1)).replace('.', ',');
    }
  };

  // ------------------------------------------------------------ memòria cau

  /* EL PREFIX ÉS DE L'APP, NO DEL MARC. Nutrició, el cos i les finances
     viuen totes a poldpm.github.io, i el navegador hi té UN SOL localStorage
     per a totes. Amb el «jefe.» de sempre, connectar-ne una sobreescrivia
     l'adreça i la clau de l'altra. */
  var PREFIX_CAU = 'cos.';

  var Cau = {
    get: function (clau, perDefecte) {
      try {
        var v = localStorage.getItem(PREFIX_CAU + clau);
        return v === null ? perDefecte : JSON.parse(v);
      } catch (e) { return perDefecte; }
    },
    set: function (clau, valor) {
      try { localStorage.setItem(PREFIX_CAU + clau, JSON.stringify(valor)); } catch (e) {}
    },
    treu: function (clau) { try { localStorage.removeItem(PREFIX_CAU + clau); } catch (e) {} },

    /* Tota una família de cop: després d'escriure una dada, TOTES les pantalles
       que la mostraven han quedat velles, no només la que miraves. Sense això,
       apuntar una despesa i canviar de mes t'ensenyaria el mes d'abans sense
       el que acabes d'apuntar. */
    oblida: function (prefix) {
      try {
        var fora = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf(PREFIX_CAU + prefix) === 0) fora.push(k);
        }
        fora.forEach(function (k) { localStorage.removeItem(k); });
      } catch (e) {}
    }
  };

  // ------------------------------------------------------- crides al servidor

  /* -------------------------------------------------------------------------
     DOS TRANSPORTS, LA MATEIXA CRIDA

     Dins d'Apps Script s'usa google.script.run. Servida des de fora (GitHub
     Pages), s'usa fetch contra el desplegament. Els mòduls no saben ni els
     importa quin dels dos és.

     TOTS DOS PORTEN LA CLAU. Aquí hi deia que google.script.run «ja ve
     autenticat», i era mentida: el desplegament és anònim, i qualsevol que
     obrís l'adreça rebia aquesta mateixa pàgina i podia cridar el servidor
     des de la consola. Ara la clau va davant a les dues bandes.

     `text/plain` no és un error: amb JSON el navegador enviaria una petició
     de comprovació prèvia que Apps Script no sap respondre. El cos segueix
     sent JSON; només canvia l'etiqueta.
     ------------------------------------------------------------------------- */

  function dinsAppsScript() {
    return !!(window.google && google.script && google.script.run);
  }

  var Servidor = {
    config: function () { return Cau.get('servidor', null); },
    clau: function () { var c = Cau.get('servidor', null); return (c && c.clau) || ''; },
    desa: function (url, clau) { Cau.set('servidor', { url: url, clau: clau }); },
    esborra: function () { Cau.treu('servidor'); },
    /* QUÈ CAL PER PARLAR. Dins d'Apps Script, l'adreça és la de la pàgina i
       no se n'ha de demanar cap; la clau sí, i abans no se'n demanava perquè
       es donava per fet que ser-hi a dins ja era estar autenticat. No ho era:
       el desplegament és anònim i qualsevol hi podia ser a dins. */
    llest: function () {
      var c = Cau.get('servidor', null);
      if (!c || !c.clau) return false;
      return dinsAppsScript() ? true : !!c.url;
    }
  };

  function cridaLocal_(modul, accio, params) {
    var clau = Servidor.clau();
    if (!clau) {
      var sense = new Error('Encara no has connectat l\'app amb el teu servidor.');
      sense.senseServidor = true;
      return Promise.reject(sense);
    }
    return new Promise(function (resolta, falla) {
      google.script.run
        .withSuccessHandler(function (r) {
          App.enLinia(true);
          if (r && r.ok) return resolta(r.dades);
          var err = new Error((r && r.error) || 'El servidor ha respost sense dades.');
          err.api = true;
          if (/clau d'accés/i.test(err.message)) err.clauDolenta = true;
          falla(err);
        })
        .withFailureHandler(function (err) {
          App.enLinia(false);
          var e = new Error(err && err.message ? err.message : 'No hi ha connexió amb el servidor.');
          e.xarxa = true; falla(e);
        })
        .api(clau, modul, accio, params || {});
    });
  }

  function cridaRemota_(modul, accio, params) {
    var cfg = Servidor.config();
    if (!cfg || !cfg.url || !cfg.clau) {
      var e = new Error('Encara no has connectat l\'app amb el teu servidor.');
      e.senseServidor = true;
      return Promise.reject(e);
    }
    return fetch(cfg.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ clau: cfg.clau, modul: modul, accio: accio, params: params || {} })
    })
    .then(function (r) {
      /* HA CONTESTAT: o sigui que xarxa n'hi ha. Es conserva `xarxa` perquè
         un 500 val la pena reintentar-lo i la cua l'ha de guardar, però es
         marca `servidor` perquè ningú digui que estàs sense cobertura. */
      if (!r.ok) {
        App.enLinia(true);
        var e = new Error('El servidor ha respost ' + r.status + '.');
        e.xarxa = true; e.servidor = true; throw e;
      }
      return r.json();
    })
    .then(function (r) {
      App.enLinia(true);
      if (r && r.ok) return r.dades;
      var err = new Error((r && r.error) || 'El servidor ha respost sense dades.');
      err.api = true;
      if (/clau d'accés/i.test(err.message)) err.clauDolenta = true;
      throw err;
    })
    .catch(function (err) {
      if (!err.api && !err.senseServidor) {
        err.xarxa = true;
        /* NOMÉS ÉS «SENSE CONNEXIÓ» SI DE DEBÒ NO N'HI HA. La bandera diu
           «el que toquis es desarà quan tornis a tenir cobertura», i sortia
           igualment quan el servidor contestava un error: mentida, i a més
           no marxava mai fins que una crida tornava bé. Si hem rebut
           resposta, hi ha xarxa; el que falla és l'altra banda. */
        if (!err.servidor) App.enLinia(false);
      }
      throw err;
    });
  }

  function crida(modul, accio, params) {
    return dinsAppsScript() ? cridaLocal_(modul, accio, params)
                            : cridaRemota_(modul, accio, params);
  }

  /**
   * ESCRIURE I TORNAR AMB LA PANTALLA JA REFETA, EN UN SOL VIATGE.
   *
   * `crida(...).then(carrega)` són dues anades al servidor, i a Apps Script
   * cada anada costa un segon i mig facis el que facis. Amb això se'n fa una:
   * el servidor desa i, abans de contestar, torna a muntar la pantalla.
   *
   * Es resol AMB LA PANTALLA, no amb el que ha tornat l'escriptura. Si el que
   * et cal és això altre, fes servir `crida` de tota la vida.
   */
  function escriu(modul, accio, params, paramsPantalla) {
    var p = {};
    for (var k in (params || {})) p[k] = params[k];
    p._pantalla = paramsPantalla || {};

    return crida(modul, accio, p).then(function (r) {
      return (r && r._pantalla !== undefined) ? r._pantalla : r;
    });
  }

  // ------------------------------------------------- cua d'escriptures pendents

  /* ==========================================================================
     TOTES LES PANTALLES EN UNA ANADA, i abans que les demanis

     El problema no era que les pantalles es muntessin lentes —mesurat el 4
     d'agost del 2026: cap passa de mig segon al servidor—. Era que cada
     apartat feia el seu propi viatge, i cada viatge a Apps Script val DOS
     SEGONS abans de fer res. Obrir l'app i tocar quatre apartats eren vuit
     segons d'espera pura.

     Això en fa un de sol, en segon pla, just després d'arrencar, i desa cada
     pantalla amb la clau que la seva vista mirarà. Quan hi entres, ja hi és.

     LA TAULA DE CLAUS ÉS AQUÍ i no al servidor a posta: quina clau fa servir
     una vista és cosa de la vista, i el nucli no ha de saber-ne res. Si un dia
     una vista canvia de clau, es canvia aquí i prou; i si algú se n'oblida, el
     pitjor que passa és que aquella pantalla torni a fer el seu viatge com
     abans —no que ensenyi res que no toca.
     ========================================================================== */
  var Precarrega = {
    fet: 0,

    clauDe: function (modul, avui) {
      switch (modul) {
        case 'habits':    return 'habits.' + avui;
        case 'calendari': return 'calendari.' + avui.slice(0, 7);
        case 'tasques':   return 'tasques.llista';
        case 'seguiment': return 'seguiment';
        case 'diari':     return 'diari.' + avui;
        case 'nutricio':  return 'nutricio.dia.' + avui;
        case 'finances':  return 'finances.mes.ara';
        default:          return null;      // el que no sabem, no es desa
      }
    },

    /**
     * QUÈ ES DESA, no només on.
     *
     * Gairebé totes les vistes es desen la resposta sencera, però els hàbits
     * no: la seva resposta porta dues coses —el dia i el full del mes— i cada
     * una va a la seva clau. Desar-hi el paquet sencer feia que la vista es
     * pensés que allò era el dia, i petava en obrir amb «Cannot read properties
     * of undefined». Va passar la primera nit que va existir això.
     *
     * Per això aquí es diu com es desa cada mòdul i no només sota quina clau:
     * si una vista parteix la seva resposta, s'ha de partir igual.
     */
    desa: function (modul, dades, avui) {
      if (modul === 'habits') {
        if (dades.dia) Cau.set('habits.' + avui, dades.dia);
        if (dades.mes) Cau.set('habits.mes', dades.mes);
        return;
      }
      var clau = this.clauDe(modul, avui);
      if (clau) Cau.set(clau, dades);
    },

    omple: function () {
      /* Un cop per obertura i prou. Tornar-hi cada vegada que canvies
         d'apartat seria fer feina per no guanyar res: el que hi ha desat es
         posa al dia sol quan entres. */
      if (this.fet) return;
      this.fet = Date.now();

      var jo = this;
      /* Mig segon de marge perquè la pantalla que hagis obert tingui la
         connexió per a ella sola: el paquet és per a les que ENCARA no mires. */
      setTimeout(function () {
        crida('nucli', 'paquet', {}).then(function (r) {
          if (!r || !r.pantalles) return;
          var avui = r.avui || fmt.avui();
          Object.keys(r.pantalles).forEach(function (id) {
            var dades = r.pantalles[id];
            if (!dades) return;
            if (id === '_dia') { Cau.set('dia.' + avui, dades); return; }
            jo.desa(id, dades, avui);
          });
        }).catch(function () {
          /* Si falla, no passa res de res: cada pantalla sap demanar la seva. */
        });
      }, 500);
    }
  };

  var Cua = {
    tot: function () { return Cau.get('cua', []); },

    afegeix: function (modul, accio, params, clau) {
      var cua = Cua.tot();
      // Una sola entrada per clau: tocar cinc cops el mateix hàbit desa un cop.
      if (clau) cua = cua.filter(function (i) { return i.clau !== clau; });
      cua.push({ modul: modul, accio: accio, params: params, clau: clau || null, ts: Date.now() });
      Cau.set('cua', cua);
      App.pintaPendents();
    },

    /**
     * Envia la cua en sèrie.
     *
     * UNA QUE FALLA NO SE N'HA D'EMPORTAR CAP ALTRA. Abans, quan el servidor
     * en rebutjava una, s'esborrava la cua SENCERA: les que anaven darrere ni
     * s'havien provat i desapareixien igual. I el missatge més probable és
     * «El sistema està ocupat processant una altra operació. Torna-ho a
     * provar» —un error que passa sol, perquè a Apps Script salta cada vegada
     * que dues coses toquen el full alhora—, o sigui que et deia que ho
     * tornessis a provar just després d'haver-t'ho llençat tot. Marcar cinc
     * hàbits sense cobertura i perdre'ls tots en tornar-hi és exactament el
     * contrari del que ha de fer una cua.
     *
     * Ara: la que el servidor rebutja se'n va sola i les altres segueixen. La
     * que falla per xarxa atura la tanda i es conserva tot, que això sí que es
     * reintenta a la propera obertura.
     */
    envia: function () {
      var cua = Cua.tot();
      if (!cua.length) return Promise.resolve(0);

      function treu(item) {
        Cau.set('cua', Cua.tot().filter(function (i) { return i.ts !== item.ts; }));
        App.pintaPendents();
      }

      var enviades = 0, rebutjades = 0, primerError = null, atura = false;

      return cua.reduce(function (cadena, item) {
        return cadena.then(function () {
          if (atura) return;
          return crida(item.modul, item.accio, item.params).then(function () {
            enviades++;
            treu(item);
          }, function (err) {
            if (err.api) {
              // El servidor l'ha rebutjada: reintentar-la eternament no la
              // salvarà. Fora aquesta, i les altres encara tenen el seu torn.
              rebutjades++;
              if (!primerError) primerError = err.message;
              treu(item);
              return;
            }
            atura = true;   // sense xarxa: es conserva tot i ja tornarà
          });
        });
      }, Promise.resolve()).then(function () {
        if (rebutjades) {
          App.brindis(rebutjades === 1
            ? 'No s\'ha pogut desar un canvi: ' + primerError
            : 'No s\'han pogut desar ' + rebutjades + ' canvis. El primer: ' + primerError,
            'error');
        }
        return enviades;
      });
    }
  };

  // -------------------------------------------------------------- components

  var Comp = {
    carregant: function (files) {
      var n = files || 4, h = '<div class="marques" aria-busy="true" aria-label="Carregant">';
      for (var i = 0; i < n; i++) h += '<div class="esquelet marca-fantasma"></div>';
      return h + '</div>';
    },

    buit: function (titol, text, botoHtml) {
      return '<div class="estat">' + ic('cos', 'ic-g') +
             '<h2>' + esc(titol) + '</h2>' +
             '<p>' + esc(text) + '</p>' + (botoHtml || '') + '</div>';
    },

    /**
     * UN ERROR HA DE TENIR SORTIDA.
     *
     * Sense servidor connectat, aquesta pantalla deia «Alguna cosa ha fallat ·
     * Encara no has connectat JEFE» i oferia «Torna-ho a provar», que tornava
     * a fallar perquè no hi havia res a reintentar: faltava la clau i no hi
     * havia cap manera d'escriure-la si no recarregaves la pàgina a mà. Era
     * un cul-de-sac. Ara el que et falta és el que et demana.
     */
    error: function (err, reintenta) {
      var esXarxa = err && err.xarxa;
      var sense = err && err.senseServidor;
      var dolenta = err && err.clauDolenta;

      var titol = sense ? 'Encara no has connectat l\'app'
                : dolenta ? 'La clau no és correcta'
                : esXarxa ? 'Sense connexió'
                : 'Alguna cosa ha fallat';
      var icona = sense || dolenta ? 'avis' : (esXarxa ? 'sense-xarxa' : 'avis');
      var text = sense
        ? 'Cal la clau que et va donar generaClauAcces() per poder llegir les teves dades.'
        : (err && err.message ? err.message : String(err));

      return '<div class="estat">' + ic(icona, 'ic-g') +
             '<h2>' + esc(titol) + '</h2>' +
             '<p>' + esc(text) + '</p>' +
             (sense || dolenta
               ? '<button class="btn btn-primari" data-connecta-ara="1">Connecta</button>'
               : (reintenta ? '<button class="btn btn-secundari" data-reintenta="1">Torna-ho a provar</button>' : '')) +
             /* SORTIR D'AQUÍ NO POT DEPENDRE DE SI HI HA RES A REINTENTAR.
                Aquest botó penjava de `reintenta`, i una pantalla que peta
                pintant-se no en passa cap: quedaves en una pàgina amb el text
                de l'error i CAP botó. Comprovat amb Hàbits. El comentari de
                més amunt ja explica que això va ser un cul-de-sac una vegada;
                ho era encara per al cas general. */
             '<button class="btn btn-fantasma" data-va-inici="1">Torna a l\'inici</button>' +
             '</div>';
    },

    avis: function (titol, text) {
      return '<div class="avis">' + ic('avis') +
             '<div><strong>' + esc(titol) + '</strong>' + esc(text) + '</div></div>';
    },

    targeta: function (contingut) { return '<div class="targeta">' + contingut + '</div>'; }
  };

  // --------------------------------------------------------------- aplicació

  var App = {
    vistes: {},
    actual: null,
    moduls: [],
    enLiniaEstat: true,

    registraVista: function (id, def) { App.vistes[id] = def; },

    arrenca: function (estatInicial) {
      App.moduls = (estatInicial && estatInicial.moduls) || Cau.get('moduls', []);
      App.pintaNav();
      /* UN SOL FULL, EL CLAR. Amb «segons el sistema», la mateixa app sortia
         d'un color al mòbil i d'un altre a l'ordinador, i això no és una app:
         són dues. El cos és el camp pàl·lid de la seva icona. */
      App.aplicaTema();

      /* LA MARCA DE VERSIÓ. La construcció hi deixa la data i, si el codi
         estava net, el commit. El «· en curs» —que vol dir que es va
         construir amb canvis sense desar— no li diu res a ningú que no sigui
         jo, i es treu: el que ha de llegir ell és quan es va penjar això que
         està mirant. */
      (function () {
        var on = document.getElementById('marca-versio');
        if (!on || !window.MARCA_JEFE) return;
        on.textContent = String(window.MARCA_JEFE).replace(/\s*·\s*en curs\s*$/, '');
      })();

      /* ELS VIGILANTS ES REGISTREN SEMPRE, i abans de res.
         Abans, si encara no hi havia clau d'accés, aquesta funció sortia aquí
         mateix per demanar-la. Amb la sortida se n'anava tot el que ve
         després: el botó d'enrere del mòbil, la cua del que s'ha d'enviar
         quan torni la cobertura, i el detectar que has recuperat la xarxa.
         I un cop posaves la clau ja no es tornava a arrencar, o sigui que
         l'app es quedava coixa la resta de la sessió sense dir-ho.

         Registrar-los no costa res ni depèn de tenir servidor. El que depèn
         del servidor és què s'ensenya, i això va més avall. */
      window.addEventListener('popstate', function (ev) {
        var id = (ev.state && ev.state.vista) || 'inici';
        App.ves(App.vistes[id] ? id : 'inici', null, true);
      });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) Cua.envia();
      });
      window.addEventListener('online', function () { App.enLinia(true); Cua.envia(); });
      window.addEventListener('offline', function () { App.enLinia(false); });

      // Encara sense clau —o sense adreça, si se serveix de fora—: connectar.
      if (!Servidor.llest()) {
        App.ves('inici');
        setTimeout(function () { App.connecta(); }, 300);
        return;
      }

      /* EL FULL ÍNDEX ÉS LA PANTALLA D'ARRENCADA.
         Ho era la conversa —l'assistent— i s'ha tret: en Pol el va fer servir
         i la conclusió va ser que per fer una cosa és més ràpid fer-la que
         demanar-la. El que ha de sortir en obrir l'app és on és tot i què
         queda pendent, no una caixa per escriure-hi.
         I SEMPRE, encara que ahir sortissis d'una altra vista. Recordar
         l'última convertia qualsevol pantalla sense sortida en una trampa que
         ni reinstal·lant l'app es desfeia, perquè la cau sobreviu a la
         instal·lació.
         L'única excepció és una destinació demanada explícitament a l'adreça,
         que és com arriben les notificacions: tocar «falten les cremades» ha
         de dur a Nutrició i no a l'índex. Es consumeix i prou: no es desa. */
      /* EL HASH POT PORTAR UNA DATA: «#dia:2026-08-05».
         Sense això, el resum de les onze i mitja —que parla de demà— t'obria
         la pàgina d'avui, que és justament el dia del qual no et parlava. */
      var d = App.deLAdreca(String(location.hash || ''));
      if (d.vista && App.vistes[d.vista]) {
        try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
        App.ves(d.vista, d.params);
      } else {
        App.ves('inici');
      }

      /* TOCAR UNA NOTIFICACIÓ AMB L'APP JA OBERTA.
         Aquest és el cas més habitual i era el que pitjor anava: el
         treballador de servei li feia el focus a la finestra i s'acabava
         aquí, o sigui que la notificació et deixava exactament on ja eres.
         Ara el treballador diu on has d'anar i s'hi va sense recarregar res:
         és instantani i no perds el que tinguessis obert.

         El `hashchange` és la xarxa de seguretat per si el missatge no
         arriba: el treballador també canvia l'adreça. */
      if (navigator.serviceWorker) {
        navigator.serviceWorker.addEventListener('message', function (ev) {
          var m = ev && ev.data;
          if (!m || m.jefe !== 'ves') return;
          var y = App.deLAdreca('#' + String(m.vista || ''));
          if (y.vista && App.vistes[y.vista]) App.ves(y.vista, y.params);
        });
      }
      window.addEventListener('hashchange', function () {
        var x = App.deLAdreca(String(location.hash || ''));
        if (!x.vista || !App.vistes[x.vista]) return;
        try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
        App.ves(x.vista, x.params);
      });

      Cua.envia();

      /* Refresca la llista de mòduls en segon pla: un mòdul nou apareix sol.
         Demana `moduls` i no `inici`: d aquesta resposta només se n aprofita
         la llista, i `inici` a sobre munta totes les targetes del full índex,
         que és la part cara de la petició. */
      crida('nucli', 'moduls', {}).then(function (d) {
        Cau.set('moduls', d.moduls);
        if (JSON.stringify(d.moduls) !== JSON.stringify(App.moduls)) {
          App.moduls = d.moduls; App.pintaNav();
        }
      }).catch(function () { /* sense connexió: seguim amb la cau */ });

      Precarrega.omple();
    },

    /**
     * QUÈ DEMANA UNA ADREÇA. «#dia» o «#dia:2026-08-05».
     *
     * Els dos punts i no una interrogació a posta: el hash no és una consulta
     * i posar-hi «?» faria pensar que ho és. Una data i prou, que és l'únic
     * que cal —si algun dia en calen dos, ja es veurà, però no s'inventa ara.
     */
    deLAdreca: function (hash) {
      var t = String(hash || '').replace(/^#/, '').trim();
      if (!t) return { vista: '', params: {} };
      var i = t.indexOf(':');
      if (i === -1) return { vista: t, params: {} };
      var vista = t.slice(0, i);
      var valor = t.slice(i + 1);
      /* LA FORMA NO FA UNA DATA.
         Comprovava que fossin quatre xifres, un guionet i les altres, i prou:
         «#dia:2026-13-45» passava el filtre, el constructor de dates el feia
         rodar i t obria el 14 de febrer del 2027 com si res. Per aquí és per
         on entren les notificacions, o sigui que una data malmesa t hauria
         ensenyat l agenda d un altre dia sense dir-ho. Ara es construeix i es
         comprova que en surti el mateix dia que hi havia escrit. */
      var esData = false;
      if (/^\d{4}-\d{2}-\d{2}$/.test(valor)) {
        var d = new Date(valor + 'T00:00:00');
        esData = !isNaN(d.getTime()) &&
                 [d.getFullYear(), ('0' + (d.getMonth() + 1)).slice(-2),
                  ('0' + d.getDate()).slice(-2)].join('-') === valor;
      }
      return { vista: vista, params: esData ? { data: valor } : {} };
    },

    /* Portar-se totes les pantalles d'una anada. Surt aquí perquè hi ha dos
       moments que ho volen: en arrencar, i just quan acabes de connectar el
       servidor —aquell dia l'arrencada ja havia passat de llarg. */
    precarrega: function () { Precarrega.omple(); },

    ves: function (id, params, sensePila) {
      var def = App.vistes[id];
      if (!def) { id = 'inici'; def = App.vistes.inici; }

      // El botó d'enrere del mòbil ha de funcionar: és el primer que prems quan
      // vols sortir d'algun lloc. Només apilem els canvis de vista, no els de
      // dins d'una vista (canviar de dia no és navegar).
      if (!sensePila && App.actual && App.actual !== id) {
        try { history.pushState({ vista: id }, ''); } catch (e) { /* no és cap error */ }
      }

      App.actual = id;
      /* Quina pantalla s'està veient, al `body`. De moment només ho fa servir
         la marca de versió per apartar-se del micròfon a la conversa, però
         qualsevol cosa que hagi de dependre de la pantalla ja té on mirar. */
      document.body.dataset.vista = id;

      document.querySelectorAll('.nav a').forEach(function (a) {
        if (a.dataset.vista === id) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });

      /* CADA VISTA PINTA A LA SEVA PRÒPIA CAPSA, I NO AL CONTENIDOR.
         -----------------------------------------------------------------
         Abans totes rebien el mateix `#vista`. Una petició al servidor triga
         un segon i mig, i si en aquell segon i mig canviaves de pantalla, la
         resposta de la que havies deixat arribava i s'escrivia al mateix
         `#vista` —que ara era d'una altra vista— i te la tornava a plantar
         al davant. Des de fora: obres un apartat, en surts, i al cap d'uns
         segons se't torna a obrir sol.

         Amb una capsa per render, la vista vella escriu a un tros de DOM que
         ja no penja d'enlloc: no es veu, i a més `arrel.isConnected` passa a
         ser fals, que és el que les vistes ja miren per no fer feina de
         franc. Val per a totes, i per a les que es facin d'ara endavant. */
      var contenidor = document.getElementById('vista');
      contenidor.innerHTML = '';
      var arrel = document.createElement('div');
      arrel.className = 'vista-capsa';
      contenidor.appendChild(arrel);

      window.scrollTo(0, 0);
      /* SI PETA PINTANT, LA CÒPIA DESADA ÉS SOSPITOSA I SE'N VA.
         Aquesta pantalla es pinta del que hi ha a localStorage, i abans es
         quedava així: una resposta del servidor amb una forma que la vista no
         esperava es desava, es tornava a pintar a cada càrrega i petava
         igual. Recarregar no ho arreglava —comprovat amb Hàbits, "Cannot read
         properties of undefined"— i l'única sortida era buidar les dades del
         lloc des del navegador, que amb l'app instal·lada no se li acut a
         ningú. El desencadenant més probable aquí és una versió desplegada a
         mitges, que ja ha passat.
         La cua NO es toca: viu a 'cua' i no porta el nom de cap pantalla, o
         sigui que el que tinguis pendent d'enviar segueix sent-hi. */
      try { def.render(arrel, params || {}); }
      catch (err) {
        try { Cau.oblida(id + '.'); Cau.treu(id); } catch (e) {}
        arrel.innerHTML = Comp.error(err, function () { App.ves(id, params, true); });
      }
    },

    refresca: function () { App.ves(App.actual); },

    /**
     * ESTÀS TOCANT ALGUNA COSA ARA MATEIX?
     *
     * Les vistes es pinten dues vegades: primer amb el que hi havia desat i
     * després amb el que arriba del servidor. Aquesta segona vegada refà
     * l'HTML, i si en aquell moment tenies un desplegable obert o estaves
     * escrivint, allò desapareix: el menú es tanca sol i el que havies teclejat
     * es perd. Abans de repintar, es pregunta.
     */
    interactuant: function () {
      var a = document.activeElement;
      if (!a) return false;
      if (document.getElementById('fosc').dataset.obert === '1') return true;
      var t = a.tagName;
      return t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA' || a.isContentEditable;
    },

    pintaNav: function () {
      var nav = document.getElementById('nav');
      if (!nav) return;                    // sense barra de seccions: no és cap error
      var items = [{ id: 'inici', nom: 'Inici', icona: 'inici' }].concat(
        App.moduls.filter(function (m) { return m.teVista; })
      );
      nav.innerHTML = items.map(function (m) {
        /* L'ADREÇA ÉS LA DE DEBÒ I NO UN `#` buit. Amb el coixinet sol, obrir
           un apartat en una pestanya nova —clic del mig, o clic amb Ctrl— et
           duia a l'índex, perquè l'enllaç no deia enlloc. L'arrencada ja sap
           llegir «#habits» de l'adreça, o sigui que aquesta és la que hi ha
           d'anar. El clic normal el segueix aturant el guió de sempre. */
        return '<a href="#' + esc(m.id) + '" data-vista="' + esc(m.id) + '">' +
               ic(m.icona || 'modul') + '<span>' + esc(m.nom) + '</span></a>';
      }).join('');
      nav.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function (ev) {
          /* Si demana pestanya nova, que se'n vagi pel seu compte. */
          if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button === 1) return;
          ev.preventDefault(); App.ves(a.dataset.vista);
        });
      });
    },

    // ------------------------------------------------------------ indicadors

    enLinia: function (si) {
      if (App.enLiniaEstat === si) return;
      App.enLiniaEstat = si;
      document.getElementById('sense-xarxa').hidden = si;
    },

    pintaPendents: function () {
      var n = Cua.tot().length;
      var el = document.getElementById('pendents');
      el.hidden = n === 0;
      el.textContent = n === 1 ? '1 canvi pendent de desar' : n + ' canvis pendents de desar';
    },

    /**
     * REFER UNA PANTALLA SENSE QUE SE'T MOGUI DE LLOC.
     *
     * Repintar una llista sencera per un canvi petit té un preu que no es veu
     * llegint el codi i es veu de seguida fent servir l'app: has baixat fins a
     * la setena tasca, la marques, i la pàgina et torna a dalt de tot. O puges
     * la primera de tres fotos i has de tornar a baixar per pujar la segona.
     *
     * On el canvi és d'una sola cosa —treure una targeta— val més tocar només
     * aquella i no passar per aquí. Això és per als altres casos: quan el que
     * canvia és l'estructura i refer-ho és el més honest, però no hi ha cap
     * raó perquè a més et faci perdre el lloc on eres.
     *
     * No salta al buit: si la pàgina nova és més curta, es queda al final.
     */
    mantenintLaVista: function (fer) {
      var y = window.scrollY || document.documentElement.scrollTop || 0;
      fer();
      if (!y) return;
      requestAnimationFrame(function () {
        var max = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
        window.scrollTo(0, Math.min(y, max));
      });
    },

    brindis: function (text, tipus) {
      var el = document.getElementById('brindis');
      el.innerHTML = ic(tipus === 'error' ? 'avis' : 'fet') + '<span>' + esc(text) + '</span>';
      el.dataset.to = tipus || 'ok';
      el.dataset.visible = '1';
      clearTimeout(App._brindis);
      App._brindis = setTimeout(function () { el.dataset.visible = '0'; }, tipus === 'error' ? 5000 : 2600);
    },

    // ---------------------------------------------------------------- modal

    modal: function (titol, html, alTancar) {
      var fosc = document.getElementById('fosc');
      // Qui l'ha obert: en tancar-lo, el focus hi ha de tornar.
      App._quiObria = document.activeElement;
      fosc.innerHTML =
        '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(titol) + '">' +
          '<div class="modal-cap"><h2>' + esc(titol) + '</h2>' +
          '<button class="btn btn-fantasma btn-icona" data-tanca="1" aria-label="Tanca">' + ic('tancar') + '</button></div>' +
          html +
        '</div>';
      fosc.dataset.obert = '1';
      App._alTancar = alTancar || null;

      fosc.querySelector('[data-tanca]').addEventListener('click', App.tancaModal);
      fosc.addEventListener('click', function (ev) { if (ev.target === fosc) App.tancaModal(); });

      /* EL CAMP QUE TOCA, SI LA PANTALLA EL DIU. El dia del control ja ve
         posat: el primer que escrius el diumenge és el pes. */
      var primer = fosc.querySelector('[data-primer]') ||
                   fosc.querySelector('input, select, textarea, button:not([data-tanca])');
      if (primer && primer.type !== 'button') setTimeout(function () { primer.focus(); }, 320);
      return fosc.querySelector('.modal');
    },

    /* ------------------------------------------------------------------
       EL VISOR: coses que es poden ENSENYAR

       Una pantalla declara què sap ensenyar i amb quin nom:

           App.registraVisor('habits.comptador', {
             titol: function (p) { return 'Cigarros'; },
             render: function (arrel, params) { ... }
           });

       I una eina de la IA diu `mostra: 'habits.comptador'`. Quan en Pol li
       demana «ensenya'm la gràfica del tabac», JEFE obre el plafó amb allò
       en comptes de contestar-li amb una descripció.

       AFEGIR-NE UN ÉS UNA LÍNIA AL FITXER D'AQUELLA PANTALLA. El nucli no
       sap què és una corba ni una setmana: només sap obrir el que li han
       registrat, igual que amb les vistes.
       ------------------------------------------------------------------ */
    visors: {},

    /**
     * PREGUNTAR ABANS D'ESBORRAR.
     *
     * El calendari i les fotos de seguiment ja ho feien bé —fins i tot diuen
     * que la foto es queda trenta dies a la paperera—, i la resta de pantalles
     * no ho feien gens: treure un moviment del banc, arxivar una categoria,
     * un actiu, un rebut fix o esborrar un entrenament passaven al primer toc,
     * sense preguntar i sense poder desfer-ho.
     *
     * Va aquí i no a cada vista perquè el que faltava era el mateix a totes, i
     * perquè el diàleg pot sortir des de dins d'un altre —editant un moviment,
     * per exemple—: llavors primer es tanca el que hi ha i s'espera que
     * l'animació acabi, que és el que ja feia el calendari a mà.
     */
    confirma: function (titol, explicacio, textSi, alSi) {
      var obert = document.getElementById('fosc').dataset.obert === '1';
      if (obert) App.tancaModal();
      setTimeout(function () {
        var cos = App.modal(titol,
          '<div class="form-ajustos">' + explicacio +
            '<button class="btn btn-primari" data-si>' + textSi + '</button>' +
            '<button class="btn btn-secundari" data-no style="margin-top:var(--e2)">' +
              'Deixa-ho estar</button>' +
          '</div>');
        cos.querySelector('[data-no]').addEventListener('click', App.tancaModal);
        cos.querySelector('[data-si]').addEventListener('click', function () {
          this.disabled = true;
          alSi(this);
        });
      }, obert ? 220 : 0);
    },

    registraVisor: function (clau, def) { App.visors[clau] = def; },

    obreVisor: function (clau, params) {
      var def = App.visors[clau];
      /* Ni aquí es parla de dins. Si algun dia s'obre un visor que no
         existeix, el que ell ha de llegir és què li ha passat a ell, no que
         a mi em falta una peça. */
      if (!def) { App.brindis('Això encara no ho sé ensenyar.', 'error'); return null; }
      params = params || {};

      var titol = typeof def.titol === 'function' ? def.titol(params) : (def.titol || '');
      var cos = App.modal(titol, '<div class="visor-cos"></div>');
      var modal = cos;
      modal.dataset.visor = '1';
      /* Les claus van dins del plafó i no al marc del modal: han de sortir
         a les seves cantonades, i el marc no és seu. */
      ['d1', 'd2', 'd3', 'd4'].forEach(function (c) {
        var e = document.createElement('span');
        e.className = 'visor-clau ' + c;
        modal.appendChild(e);
      });

      try { def.render(modal.querySelector('.visor-cos'), params); }
      catch (err) {
        modal.querySelector('.visor-cos').innerHTML = Comp.error(err, false);
      }
      return modal;
    },

    tancaModal: function () {
      var fosc = document.getElementById('fosc');
      fosc.dataset.obert = '0';

      /* EL FOCUS HA DE SORTIR D'AQUÍ ABANS QUE EL TAULER, i tornar a qui
         l'obria. Sense això passaven dues coses, i totes dues es veien:
         llegit en veu alta, quedaves dins d'un diàleg que ja no hi és; i
         `interactuant()` seguia dient que sí durant tot el temps que el camp
         encara existís, o sigui que qualsevol pantalla que esperés a
         repintar-se «quan paris de tocar coses» no es repintava mai —el
         calendari, canviant quins mires, no s'assabentava del canvi—. */
      var dins = document.activeElement;
      if (dins && fosc.contains(dins)) { try { dins.blur(); } catch (e) {} }
      var obria = App._quiObria;
      App._quiObria = null;
      if (obria && obria.isConnected && typeof obria.focus === 'function') {
        try { obria.focus({ preventScroll: true }); } catch (e) {}
      }

      setTimeout(function () { if (fosc.dataset.obert !== '1') fosc.innerHTML = ''; }, 340);
      if (App._alTancar) { var f = App._alTancar; App._alTancar = null; f(); }
    },

    // ----------------------------------------------------------------- tema

    /**
     * Pantalla de connexió. Surt quan encara no hi ha clau, i també quan se
     * serveix de fora i no se sap a quin servidor s'ha de parlar.
     * La clau es desa al navegador i no viatja enlloc més que al teu propi
     * desplegament.
     *
     * DINS D'APPS SCRIPT NO ES DEMANA L'ADREÇA: és la de la pàgina que estàs
     * mirant. El que sí que es demana és la clau, perquè el desplegament és
     * anònim i ser a dins de la pàgina no demostra que siguis tu.
     *
     * L'ERROR SURT AL COSTAT DEL CAMP, no de brindis. El brindis sortia a
     * baix de tot, fora del diàleg, i a la pantalla petita ni es veia: deies
     * «Connecta», no passava res i no sabies per què.
     */
    connecta: function (motiu) {
      var cfg = Servidor.config() || {};
      var dins = dinsAppsScript();
      var cos = App.modal('Connecta l\'app',
        (motiu ? '<div class="avis" style="margin-bottom:var(--e4)">' + esc(motiu) + '</div>' : '') +
        (dins ? '' :
          '<label class="camp"><span>URL del desplegament</span>' +
            '<input class="entrada" id="c-url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" ' +
            'value="' + esc(cfg.url || '') + '" aria-describedby="c-mal"></label>') +
        '<label class="camp"><span>Clau d\'accés</span>' +
          '<input class="entrada" id="c-clau" type="password" autocomplete="off" ' +
          'placeholder="la que t\'ha donat generaClauAcces()" value="' + esc(cfg.clau || '') + '" ' +
          'aria-describedby="c-mal"></label>' +
        '<p class="camp-mal" id="c-mal" role="alert" hidden></p>' +
        '<p class="menut" style="margin:0 0 var(--e4)">La clau es desa només en aquest ' +
          'navegador. No surt d\'aquí excepte cap al teu propi servidor.</p>' +
        '<button class="btn btn-primari btn-ple" data-connecta="1">Connecta</button>');

      var mal = cos.querySelector('#c-mal');
      function diguesQue(text, quin) {
        mal.textContent = text;
        mal.hidden = false;
        var camp = cos.querySelector(quin);
        if (camp) { try { camp.focus(); } catch (e) {} }
      }

      /* EL BOTÓ S'AGAFA ARA, NO QUAN TORNI LA RESPOSTA.
         Això era `ev.currentTarget` a dins del `.then` i del `.catch`, i
         `currentTarget` val null quan l'esdeveniment ja s'ha acabat de
         repartir: la resposta arriba mig segon més tard i allà ja no hi ha
         cap botó. La línia petava, el `.catch` moria per dins i el botó es
         quedava girant per sempre sense dir res. Amb la clau bona no es veia
         —el modal es tancava abans—, però amb la clau dolenta et deixava
         mirant una rodeta eterna. */
      var boto = cos.querySelector('[data-connecta]');

      boto.addEventListener('click', function () {
        var campUrl = cos.querySelector('#c-url');
        var url = campUrl ? campUrl.value.trim() : (cfg.url || '');
        var clau = cos.querySelector('#c-clau').value.trim();
        mal.hidden = true;

        if (!dins && !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) {
          diguesQue('L\'URL ha d\'acabar en /exec', '#c-url'); return;
        }
        if (clau.length < 20) {
          diguesQue('La clau sembla massa curta: la de generaClauAcces() en fa 48', '#c-clau'); return;
        }

        boto.dataset.carregant = '1';
        Servidor.desa(url, clau);
        crida('nucli', 'ping', {})
          .then(function () {
            App.tancaModal(); App.brindis('Connectat');
            App.precarrega();          // el dia que connectes, l'arrencada ja ha passat
            App.refresca();
          })
          .catch(function (err) {
            boto.dataset.carregant = '0';
            Servidor.esborra();
            diguesQue(err.clauDolenta ? 'La clau no és correcta'
                    : err.xarxa ? 'No s\'ha pogut arribar al servidor. Mira l\'adreça i la connexió.'
                    : err.message, '#c-clau');
          });
      });
    },

    /**
     * CLAR I PROU. La funció es queda perquè és qui posa l'atribut en
     * arrencar; ja no pregunta res a ningú. El que hi hagués desat d'abans
     * —«fosc», d'un aparell que venia de JEFE— es migra aquí.
     */
    aplicaTema: function () {
      Cau.set('tema', 'clar');
      document.documentElement.setAttribute('data-tema', 'clar');
    },

    temaActual: function () { return 'clar'; }
  };

  /* LES DUES SORTIDES D'UNA PANTALLA D'ERROR, ESCOLTADES UN SOL COP.
     Cada vista es cus el seu «Torna-ho a provar», que és seu i ha de ser-ho:
     només ella sap què tornar a demanar. Aquestes dues no són de ningú en
     particular —connectar i tornar a l'índex volen dir el mateix a tot
     arreu—, i posar-les a cada vista seria copiar-les setze vegades. */
  document.addEventListener('click', function (ev) {
    var connecta = ev.target.closest && ev.target.closest('[data-connecta-ara]');
    if (connecta) { App.connecta(); return; }
    var inici = ev.target.closest && ev.target.closest('[data-va-inici]');
    if (inici) { App.ves('inici'); return; }

    /* I «TORNA-HO A PROVAR» TAMBÉ, PEL MATEIX MOTIU.
       Cada vista se'l cusia pel seu compte i quatre se'l van deixar: el
       calendari, el dia, el diari i les finances pintaven el botó i no
       l'escoltava ningú. El premies i no passava res, que és pitjor que no
       tenir-lo. Ara viu aquí, un sol cop, com els altres dos. */
    var torna = ev.target.closest && ev.target.closest('[data-reintenta]');
    if (torna) App.refresca();
  });

  document.addEventListener('keydown', function (ev) {
    var fosc = document.getElementById('fosc');
    if (fosc.dataset.obert !== '1') return;

    if (ev.key === 'Escape') { App.tancaModal(); return; }

    /* EL FOCUS NO POT SORTIR DEL QUE HI HA OBERT.
       Amb el calaix de preguntar obert, tres tabulacions ja et deixaven als
       botons de la pantalla del darrere —tapada per la cortina i sense poder
       tocar-la amb el dit—, i des d allà podies recórrer tota l app sense
       veure on eres. Escape ja el tancava bé i el focus ja tornava al botó
       que l havia obert; el que faltava era això. */
    if (ev.key !== 'Tab') return;
    var dins = fosc.querySelectorAll(
      'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), ' +
      'textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
    var visibles = [];
    for (var i = 0; i < dins.length; i++) {
      var r = dins[i].getBoundingClientRect();
      if (r.width > 0 && r.height > 0) visibles.push(dins[i]);
    }
    if (!visibles.length) return;
    var primer = visibles[0], ultim = visibles[visibles.length - 1];
    var on = document.activeElement;
    if (!fosc.contains(on)) { ev.preventDefault(); (ev.shiftKey ? ultim : primer).focus(); return; }
    if (ev.shiftKey && on === primer) { ev.preventDefault(); ultim.focus(); }
    else if (!ev.shiftKey && on === ultim) { ev.preventDefault(); primer.focus(); }
  });

  return { App: App, Comp: Comp, Cau: Cau, Cua: Cua, crida: crida, escriu: escriu,
           esc: esc, ic: ic, fmt: fmt, Servidor: Servidor, dinsAppsScript: dinsAppsScript };
})();

var App = Jefe.App, Comp = Jefe.Comp, Cau = Jefe.Cau, Cua = Jefe.Cua;
var crida = Jefe.crida, escriu = Jefe.escriu;
var esc = Jefe.esc, ic = Jefe.ic, fmt = Jefe.fmt;
var Servidor = Jefe.Servidor, dinsAppsScript = Jefe.dinsAppsScript;
</script>

<script>
/* =========================================================================
   JEFE — notificacions al mòbil (client)

   Demana permís, obté la fitxa del dispositiu i la registra al servidor.
   A partir d'aquí JEFE et pot escriure encara que l'app estigui tancada.

   Es carrega SOLA i mai bloqueja: si Firebase no està configurat, si el
   navegador no en té, o si no hi ha xarxa, l'app funciona igual i el botó
   diu per què no.
   ========================================================================= */

var Notificacions = (function () {

  var SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
  var NO_CONFIG = 'Els avisos només funcionen des de la pàgina publicada, ' +
                  'no des de la finestra d\'Apps Script. Obre l\'app des de ' +
                  'la seva adreça de sempre i torna-ho a provar.';
  var config = null, missatgeria = null, carregant = null;

  function potSerHi() {
    return 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
  }

  function permis() {
    return potSerHi() ? Notification.permission : 'unsupported';
  }

  /** Carrega el SDK i la configuració. Un sol cop, encara que es cridi deu vegades. */
  function prepara() {
    if (carregant) return carregant;

    /* SI EL FITXER NO HI ÉS, DIGUES-HO EN CRISTIÀ.
       Aquesta pàgina se serveix des de dos llocs i només un té el fitxer al
       costat: des d'Apps Script, `firebase.config.json` no existeix i la
       resposta és la pàgina d'error del servidor. `r.json()` peta amb
       «Unexpected non-whitespace character after JSON at position 4», i això
       era el que sortia a la pantalla en tocar «Activa els avisos»: un
       missatge de l'intèrpret de JavaScript, no una explicació. */
    carregant = fetch('firebase.config.json', { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error(NO_CONFIG);
        return r.json().catch(function () { throw new Error(NO_CONFIG); });
      })
      .then(function (cfg) {
        if (!cfg.apiKey || cfg.apiKey.indexOf('POSA-HI') === 0) {
          throw new Error('Firebase encara no està configurat. Vegeu docs/03-notificacions.md');
        }
        config = cfg;
        return Promise.all([guio(SDK + 'firebase-app-compat.js'),
                            guio(SDK + 'firebase-messaging-compat.js')]);
      })
      .then(function () {
        firebase.initializeApp({
          apiKey: config.apiKey,
          projectId: config.projectId,
          messagingSenderId: config.messagingSenderId,
          appId: config.appId
        });
        missatgeria = firebase.messaging();

        // Missatge rebut amb l'app OBERTA: no el pinta el sistema, el pintem
        // nosaltres perquè no passi desapercebut enmig de la conversa.
        missatgeria.onMessage(function (m) {
          var d = (m && m.data) || {};
          App.brindis((d.titol ? d.titol + ': ' : '') + (d.cos || 'Notificació'));
        });
        return true;
      });

    return carregant;
  }

  function guio(url) {
    return new Promise(function (ok, ko) {
      var s = document.createElement('script');
      s.src = url; s.async = true;
      s.onload = ok;
      s.onerror = function () { ko(new Error('No s\'ha pogut carregar ' + url)); };
      document.head.appendChild(s);
    });
  }

  /**
   * Demana permís i registra el dispositiu.
   * El permís s'ha de demanar SEMPRE des d'un toc: si no, Chrome el denega
   * sense preguntar i et quedes sense poder-ho tornar a intentar.
   */
  function activa() {
    if (!potSerHi()) {
      return Promise.reject(new Error('Aquest navegador no pot rebre notificacions.'));
    }

    return Notification.requestPermission()
      .then(function (p) {
        if (p !== 'granted') {
          throw new Error(p === 'denied'
            ? 'Has denegat les notificacions. Per tornar-hi: cadenat de la barra d\'adreces → Notificacions → Permet.'
            : 'No has respost a la petició de permís.');
        }
        return prepara();
      })
      .then(function () {
        // Treballador propi per a les notificacions, amb abast separat del
        // de l'app: un abast només pot tenir un treballador.
        return navigator.serviceWorker.register('firebase-messaging-sw.js', { scope: './fcm/' });
      })
      .then(function (reg) {
        return navigator.serviceWorker.ready.then(function () { return reg; });
      })
      .then(function (reg) {
        return missatgeria.getToken({ vapidKey: config.vapidKey, serviceWorkerRegistration: reg });
      })
      .then(function (fitxa) {
        if (!fitxa) throw new Error('Firebase no ha donat cap fitxa per a aquest dispositiu.');
        return crida('nucli', 'registraDispositiu', { fitxa: fitxa, nom: nomDispositiu() });
      })
      .then(function () {
        Cau.set('notificacions', true);
        return true;
      });
  }

  function nomDispositiu() {
    var ua = navigator.userAgent;
    var sistema = /Android/i.test(ua) ? 'Android'
                : /iPhone|iPad/i.test(ua) ? 'iPhone'
                : /Windows/i.test(ua) ? 'Windows'
                : /Mac/i.test(ua) ? 'Mac' : 'Desconegut';
    var instalada = matchMedia('(display-mode: standalone)').matches;
    return sistema + (instalada ? ' · app instal·lada' : ' · navegador');
  }

  /** Estat per a la pantalla, sense demanar res ni carregar res. */
  function estat() {
    return {
      potSerHi: potSerHi(),
      permis: permis(),
      activades: permis() === 'granted' && Cau.get('notificacions', false)
    };
  }

  /**
   * Cada cop que obres l'app, si ja tens el permís donat:
   *
   *   1. Torna a registrar el treballador de servei. És l'única manera que
   *      una versió nova hi entri: el registre només es fa en prémer el botó,
   *      i pel seu compte Chrome només ho mira un cop al dia. Sense això pots
   *      estar-te hores provant la versió d'abans sense cap senyal.
   *
   *   2. TORNA A APUNTAR LA FITXA DEL DISPOSITIU AL FULL. I això és el que
   *      falla si no hi és: la fitxa d'FCM no és per sempre. Es renova sola
   *      —quan netegis les dades del lloc, quan reinstal·lis l'app, o quan a
   *      Firebase li sembla—, i el dia que es renova, la que hi ha desada al
   *      full deixa de servir. Des de fora no es veu res: els avisos
   *      senzillament deixen d'arribar, i no te n'assabentes fins que en
   *      trobes a faltar un. Tornar-la a apuntar cada cop que obres l'app fa
   *      que això es curi sol.
   *
   *      Al full és un «desa» per fitxa, o sigui que no s'hi acumula res: si
   *      és la mateixa, només se'n refresca la data.
   */
  function actualitza() {
    if (!potSerHi() || Notification.permission !== 'granted') return;

    navigator.serviceWorker.register('firebase-messaging-sw.js', { scope: './fcm/' })
      .then(function (reg) {
        reg.update();
        return prepara().then(function () { return reg; });
      })
      .then(function (reg) {
        return missatgeria.getToken({ vapidKey: config.vapidKey, serviceWorkerRegistration: reg });
      })
      .then(function (fitxa) {
        if (!fitxa) return;
        // Si és la mateixa que ja vam apuntar, no cal molestar el servidor.
        if (Cau.get('fitxa', '') === fitxa) return;
        return crida('nucli', 'registraDispositiu', { fitxa: fitxa, nom: nomDispositiu() })
          .then(function () { Cau.set('fitxa', fitxa); Cau.set('notificacions', true); });
      })
      .catch(function () { /* sense xarxa o sense clau: ja hi tornarem demà */ });
  }

  /* Passats uns segons de l'arrencada, no durant.
     Ara això baixa el SDK de Firebase per poder demanar la fitxa, i el que
     mana en obrir l'app és que la primera pantalla surti de seguida. Cinc
     segons més tard no els nota ningú, i la fitxa es refresca igual. */
  setTimeout(actualitza, 5000);

  return { potSerHi: potSerHi, permis: permis, estat: estat, activa: activa,
           actualitza: actualitza };
})();
</script>

<script>
/* =========================================================================
   EL COS — LA PÀGINA D'INICI

   On és cada cosa i poder-hi anar, i res més. Dues portes —el seguiment i
   els entrenaments—, la marca a dalt i, si aquest aparell encara no rep
   avisos, la crida per activar-los: l'avís del control del diumenge és
   l'únic de l'app, i si no arriba no te n'adones.

   LA MARCA A DALT ÉS LA ICONA EN GRAN: les carenes de les setmanes, la
   d'ara fosca al davant. No és decoració: és el mateix dibuix que la pila
   de carenes del seguiment, i és el que fa que aquesta app sigui aquesta.
   ========================================================================= */

App.registraVista('inici', {
  render: function (arrel) {

    /* El que fa cada porta, en una línia. Ho diu la pantalla i no el mòdul
       perquè és com en parla aquesta app; un mòdul nou entra sense línia. */
    var QUE_HI_HA = {
      seguiment: 'El control setmanal: pes, cintura, força, trail i fotos.',
      entrenaments: 'Les sessions, el km-esforç de la setmana i els passos.'
    };

    function ambPantalla() {
      return (Cau.get('moduls', []) || []).filter(function (m) {
        return m.teVista && m.id !== 'conversa';
      });
    }
    function apartats() {
      return ambPantalla().filter(function (m) { return !m.secundari; });
    }
    /* Les eines de dins, si mai n'hi ha cap: al capçal amb la icona i prou.
       Ho diu el mòdul, no aquesta pantalla. */
    function eines() {
      return ambPantalla().filter(function (m) { return m.secundari; });
    }

    function portes(l) {
      if (!l.length) {
        return '<div class="estat">' + ic('cos', 'ic-g') +
          '<h2>Encara no sé què hi ha</h2>' +
          '<p>Quan l\'app parli amb el teu servidor, aquí sortiran el seguiment i els entrenaments.</p>' +
          '<button class="btn btn-primari" data-connecta-ara="1">Connecta</button>' +
        '</div>';
      }
      return '<nav class="portes" aria-label="Apartats">' + l.map(function (m) {
        return '<button class="porta" data-ves="' + esc(m.id) + '">' +
          ic(m.icona || 'modul') +
          '<span><span class="porta-nom">' + esc(m.nom) + '</span>' +
            (QUE_HI_HA[m.id] ? '<span class="porta-que">' + esc(QUE_HI_HA[m.id]) + '</span>' : '') +
          '</span>' +
          '<svg class="ic fletxa" aria-hidden="true"><use href="#ic-dreta"/></svg>' +
        '</button>';
      }).join('') + '</nav>';
    }

    /**
     * «NO REBO ELS AVISOS QUE HAURIA DE REBRE.»
     *
     * La condició és el PERMÍS i no la fitxa, a posta. Un cop donat el
     * permís, la fitxa se la mira `actualitza()` cada cop que obres l'app i
     * es cura sola quan Firebase la renova. El permís, en canvi, només el
     * pots donar tu i només des d'un toc.
     */
    function cridaAvisos() {
      if (!window.Notificacions || !Notificacions.potSerHi()) return '';
      var p = Notificacions.permis();
      if (p === 'granted') return '';

      var negat = p === 'denied';
      return '<section class="crida-avisos" aria-label="Avisos en aquest aparell">' +
        '<svg class="ic" aria-hidden="true"><use href="#ic-campana"/></svg>' +
        '<div>' +
          '<b>Aquest aparell no rep avisos</b>' +
          '<p>' + (negat
            ? 'Has denegat les notificacions en aquest aparell. Per tornar-hi: ' +
              'si tens l\'app instal·lada, mantén premuda la icona → Informació de ' +
              'l\'app → Notificacions. Al navegador, el cadenat de la barra ' +
              'd\'adreces → Notificacions → Permet.'
            : 'L\'avís del control del diumenge al matí no t\'arribarà aquí fins que ho activis.') + '</p>' +
          (negat ? '' : '<button class="btn btn-primari" data-avisos>Activa els avisos</button>') +
        '</div>' +
      '</section>';
    }

    /* El permís s'ha de demanar SEMPRE des d'un toc: si no, Chrome el denega
       ell sol i et quedes sense poder-ho tornar a intentar. Per això va lligat
       a un botó i no a l'arrencada. */
    function lligaAvisos() {
      var b = arrel.querySelector('[data-avisos]');
      if (!b) return;
      b.addEventListener('click', function () {
        b.dataset.carregant = '1';
        Notificacions.activa()
          .then(function () {
            App.brindis('Avisos activats en aquest aparell');
            pinta(apartats());          // la crida ja no hi ha de ser
          })
          .catch(function (err) {
            b.dataset.carregant = '0';
            App.brindis(err.message, 'error');
            pinta(apartats());          // si l'ha denegat, ara toca l'explicació
          });
      });
    }

    /* LA MARCA EN GRAN. Les quatre carenes de la icona, de la més vella i clara
       a la d'ara, fosca i més gruixuda, sobre l'horitzó. */
    function marca() {
      var P = [[2.8,20.2],[6.2,15],[9.8,13.6],[10.4,12.4],[12,7.6],[13.6,12.4],[14.2,13.6],[17.8,15],[21.2,20.2]];
      var capes = [[1.3, 'var(--t1)', 1.6], [1.2, 'var(--t2)', 1.8], [1.1, 'var(--t3)', 2], [1, 'var(--t4)', 3.4]];
      var d = capes.map(function (c) {
        var K = c[0];
        var cami = 'M' + P.map(function (p) {
          var x = 12 + K * (p[0] - 12), y = 20.2 + K * (p[1] - 20.2);
          return (Math.round((90 + 7.5 * (x - 12)) * 10) / 10) + ' ' + (Math.round(7.5 * (y - 3.2) * 10) / 10);
        }).join(' L');
        return '<path d="' + cami + '" stroke="' + c[1] + '" stroke-width="' + c[2] + '"/>';
      }).join('');
      return '<svg class="inici-marca" viewBox="0 0 180 130" aria-hidden="true">' +
        '<g fill="none" stroke-linejoin="round" stroke-linecap="round">' + d + '</g>' +
        '<path d="M2 127.5H178" stroke="var(--tinta)" stroke-width="2.4"/></svg>';
    }

    function pinta(l) {
      var t = eines();
      arrel.innerHTML =
        '<header class="capcalera">' +
          '<div class="cap-fila">' +
            '<span class="marca">' + ic('cos') + '<span class="gravat tinta">El cos</span></span>' +
            (t.length
              ? '<div class="cap-eines">' + t.map(function (m) {
