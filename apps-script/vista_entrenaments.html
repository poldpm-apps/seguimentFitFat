<script>
/* EL COS — Entrenaments

   LA XIFRA QUE MANA ÉS LA CÀRREGA, no el nombre de sortides. Tot el que hi ha
   en aquesta pantalla està ordenat per aquesta idea: primer els quilòmetres
   d'esforç de la setmana, després de què estan fets, i al final cada sessió.
   Comptar sortides ja es feia i no deia res: tres de dos quilòmetres i tres de
   sis amb mil de desnivell donaven el mateix «3».

   ELS QUILÒMETRES D'ESFORÇ SURTEN EXPLICATS A LA PANTALLA. Una mesura que has
   d'anar a buscar què vol dir és una mesura que no faràs servir: la fórmula és
   una línia de text sota el número i s'hi queda per sempre. */

App.registraVista('entrenaments', {
  render: function (arrel, params) {

    var d = null;
    var dilluns = (params && params.desde) || null;

    // ------------------------------------------------------------ utilitats
    function coma(n, dec) {
      if (n === null || n === undefined || n === '') return '—';
      var v = Number(n);
      return (dec === undefined ? String(v) : v.toFixed(dec)).replace('.', ',');
    }
    function curta(iso) {
      var p = String(iso).split('-');
      return Number(p[2]) + ' ' + ['gen','feb','març','abr','maig','juny',
        'jul','ag','set','oct','nov','des'][Number(p[1]) - 1];
    }
    function suma(iso, dies) {
      var x = new Date(iso + 'T12:00:00');
      x.setDate(x.getDate() + dies);
      return x.toISOString().slice(0, 10);
    }
    /* «1 h 2» es llegeix com una hora i vint tant sovint com com una hora i
       dos. Amb el zero al davant no hi ha manera de confondre-ho. */
    function hores(min) {
      if (!min) return '';
      var h = Math.floor(min / 60), m = Math.round(min % 60);
      return h ? h + ' h ' + (m < 10 ? '0' : '') + m : m + ' min';
    }

    /* Els milers separats. Mil sis-cents i setze mil metres de desnivell són
       coses molt diferents i, sense el punt, «1600» i «16000» s'assemblen
       massa per a una xifra que es mira de passada. */
    function mil(n) {
      return Math.round(Number(n) || 0).toLocaleString('ca-ES');
    }

    // ------------------------------------------------------------ capçalera
    function capcalera() {
      var s = d.setmana;
      return '<header class="capcalera">' +
        '<div class="cap-fila">' +
          '<button class="btn btn-icona" data-torna="1" aria-label="Torna a l\'inici">' + ic('esquerra') + '</button>' +
          '<span class="marca">' + ic('cos') + '<span class="gravat tinta">El cos</span></span>' +
          '<button class="btn btn-primari" data-captura="1" aria-haspopup="dialog">' + ic('captura') + 'Captura</button>' +
        '</div>' +
        '<div class="cap-titol">' +
          '<h1>Entrenaments</h1>' +
          '<p>' + esc(curta(s.dilluns) + ' — ' + curta(s.fins)) + '</p>' +
        '</div>' +
      '</header>';
    }

    // ----------------------------------------------------------------- pinta
    function pinta() {
      var s = d.setmana;
      var esAquesta = d.dilluns === thisMonday();

      arrel.innerHTML = capcalera() +
        '<div class="pagina">' +

          /* LA NAVEGACIÓ PER SETMANES. Fletxes de debò i no un calendari: el
             que fas és mirar la d'abans, no saltar al març. */
          '<nav class="setmana-nav" aria-label="Setmana">' +
            '<button class="btn btn-icona" data-set="' + esc(suma(s.dilluns, -7)) +
              '" aria-label="Setmana anterior">' + ic('esquerra') + '</button>' +
            '<span>' + esc(esAquesta ? 'Aquesta setmana' : 'Setmana del ' + curta(s.dilluns)) + '</span>' +
            '<button class="btn btn-icona" data-set="' + esc(suma(s.dilluns, 7)) +
              '" aria-label="Setmana següent"' + (esAquesta ? ' disabled' : '') + '>' +
              ic('dreta') + '</button>' +
          '</nav>' +

          /* LA CÀRREGA, QUE ÉS EL QUE HA VINGUT A SABER. */
          '<section class="carrega-gran" data-dura="' + (s.dura ? '1' : '0') + '" aria-label="La càrrega de la setmana">' +
            '<p class="gravat">La càrrega' + (s.dura ? ' · setmana dura' : '') + '</p>' +
            '<p class="n">' + coma(s.kmEsforc, 1) + '<small>km-esforç</small></p>' +
            '<p class="menut formula">km + desnivell ÷ 100. Sis quilòmetres amb mil de ' +
              'desnivell són 16; dos de plans, 2.</p>' +
          '</section>' +
          '<div class="dades">' +
            cel('Sessions', s.sessions, '', (s.trail ? s.trail + ' trail' : '') +
                (s.trail && s.forca ? ' · ' : '') + (s.forca ? s.forca + ' força' : '')) +
            cel('Quilòmetres', coma(s.km, 1), 'km', '') +
            cel('Desnivell', mil(s.desnivell), 'm', s.llargues
                ? s.llargues + (s.llargues === 1 ? ' de llarga' : ' de llargues') : '') +
            cel('Temps', hores(s.minuts) || '—', '', '') +
          '</div>' +

          passosFitxa(s) +
          corba() +
          llista(s) +

          '<button class="btn btn-ple" data-nou="1" aria-haspopup="dialog" style="margin-top:var(--e5)">' +
            ic('mes') + 'Afegeix-ne un a mà</button>' +
        '</div>';

      lliga();
    }

    function cel(nom, valor, unitat, sota) {
      return '<div class="dada"><p class="gravat">' + esc(nom) + '</p>' +
        '<p class="v">' + esc(String(valor)) + (unitat ? '<small>' + esc(unitat) + '</small>' : '') + '</p>' +
        (sota ? '<p class="s">' + esc(sota) + '</p>' : '') + '</div>';
    }

    // -------------------------------------------------------------- passos
    /* A LA SEVA FILA I NO BARREJATS AMB LA CÀRREGA. Els passos no són
       entrenament: són el que es mou la resta del dia, i justament per això
       valen —dues setmanes amb la mateixa càrrega i vint mil passos de
       diferència no són la mateixa setmana—. */
    function passosFitxa(s) {
      if (!s.passos) {
        return '<button class="passos passos-buit" data-passos="1" aria-haspopup="dialog">' +
          '<span><span class="gravat">Passos</span>&nbsp; encara no n\'hi ha d\'aquesta setmana</span>' +
          '<span class="accio">Afegeix-los</span></button>';
      }
      return '<button class="passos" data-passos="1" aria-haspopup="dialog">' +
        '<span><span class="gravat">Passos</span>&nbsp; <b>' + esc(mil(s.passos.total)) + '</b> en set dies</span>' +
        '<span><b>' + esc(mil(s.passos.mitjana)) + '</b> al dia</span>' +
      '</button>';
    }

    // --------------------------------------------------------------- corba
    /* DOTZE SETMANES EN FILETS I NO EN LÍNIA. Una setmana és una capsa
       tancada, no un punt d'una corba contínua: no hi ha res entremig del
       dilluns i el següent. Els filets ho diuen; una línia s'ho inventaria.
       Els vells, clars; el d'ara, fosc i més gruixut. Cada filet es pot tocar
       i porta a aquella setmana. */
    function corba() {
      var c = d.corba || [];
      var max = 0;
      c.forEach(function (x) { if (x.kmEsforc > max) max = x.kmEsforc; });
      if (!max) return '';
      var W = 343, B = 108, H = 132, n = c.length;
      var rampa = [[188, 206, 212], [122, 181, 193], [28, 132, 150]];
      function mescla(t) {
        var q = t * (rampa.length - 1), a = Math.min(Math.floor(q), rampa.length - 2), f = q - a;
        return 'rgb(' + rampa[a].map(function (v, k) { return Math.round(v + (rampa[a + 1][k] - v) * f); }).join(',') + ')';
      }
      var X = function (i) { return 10 + i * (W - 20) / (n - 1); };
      var pas = (W - 20) / (n - 1);             // tota la columna es pot tocar
      /* La xifra del màxim, una vegada: a la setmana més recent que l'assoleix. */
      var ultimMax = -1;
      c.forEach(function (x, i) { if (x.kmEsforc === max) ultimMax = i; });
      var cos = '<path d="M0 ' + B + 'H' + W + '" stroke="var(--fil)" stroke-width="1"/>';
      c.forEach(function (x, i) {
        var ara = x.dilluns === d.dilluns;
        var h = x.kmEsforc / max * 84;
        var col = ara ? '#054a57' : mescla(n > 2 ? i / (n - 2) : 0);
        cos += '<g class="dotze-barra" role="button" tabindex="0" data-set="' + esc(x.dilluns) + '"' +
          (ara ? ' aria-current="true"' : '') + ' aria-label="' +
          esc('Setmana del ' + curta(x.dilluns) + ': ' + coma(x.kmEsforc, 1) + ' km-esforç') + '">' +
          '<rect class="toc" x="' + (X(i) - pas / 2) + '" y="0" width="' + pas + '" height="' + H + '"/>';
        if (!x.kmEsforc) {
          cos += '<circle cx="' + X(i) + '" cy="' + (B - 3) + '" r="2.5" fill="none" stroke="var(--t2)"/>';
        } else {
          cos += '<path d="M' + X(i) + ' ' + B + 'V' + (B - h) + '" stroke="' + col + '" stroke-width="' + (ara ? 3 : 1.5) + '"/>' +
            '<path d="M' + (X(i) - 5) + ' ' + (B - h) + 'H' + (X(i) + 5) + '" stroke="' + col + '" stroke-width="' + (ara ? 2 : 1) + '"/>';
          if (ara || (x.kmEsforc === max && i === ultimMax)) {
            /* La d'ara, a la dreta de tot: s'alinea a la dreta i puja per sobre
               de la veïna, que si no la xifra semblava seva. */
            var dalt = B - h;
            if (i === n - 1 && i > 0) dalt = Math.min(dalt, B - c[i - 1].kmEsforc / max * 84);
            cos += '<text x="' + X(i) + '" y="' + (dalt - 8) + '" text-anchor="' + (i === n - 1 ? 'end' : i === 0 ? 'start' : 'middle') + '"' +
              (ara ? ' class="ara"' : '') + '>' + coma(x.kmEsforc, x.kmEsforc % 1 ? 1 : 0) + '</text>';
          }
        }
        cos += '</g>';
      });
      cos += '<text x="0" y="' + (H - 2) + '">' + esc(curta(c[0].dilluns).toUpperCase()) + '</text>' +
        '<text x="' + W + '" y="' + (H - 2) + '" text-anchor="end" class="ara">' + esc(curta(c[n - 1].dilluns).toUpperCase()) + '</text>';
      return '<section class="seccio" aria-label="Dotze setmanes">' +
        '<div class="seccio-cap"><h2>Dotze setmanes</h2><span class="gravat">' + esc(coma(max, 0)) + ' km-e màx</span></div>' +
        '<svg class="dotze" viewBox="0 0 ' + W + ' ' + H + '">' + cos + '</svg>' +
      '</section>';
    }

    // -------------------------------------------------------------- llista
    function llista(s) {
      if (!s.llista.length) {
        return '<div class="estat">' + ic('entrenaments', 'ic-g') +
          '<h2>Cap entrenament aquesta setmana</h2>' +
          '<p>Passa la captura de la llista de la setmana i s\'ompliran tots de cop, ' +
          'amb els quilòmetres i el desnivell de cadascun.</p>' +
          '<button class="btn btn-primari" data-captura="1" aria-haspopup="dialog">' + ic('captura') + 'Passa la captura</button>' +
        '</div>';
      }
      var ordre = s.llista.slice().sort(function (a, b) { return a.data < b.data ? 1 : -1; });
      return '<section class="seccio" aria-label="Les sessions">' +
        '<div class="seccio-cap"><h2>Sessions</h2><span class="gravat">' + ordre.length +
          (ordre.length === 1 ? ' sessió' : ' sessions') + '</span></div>' +
        '<ul class="sessions">' + ordre.map(function (x) {
          var menaNom = x.mena === 'forca' ? 'força' : x.mena === 'trail' ? 'trail' : 'altre';
          return '<li><button class="sessio" data-obre="' + esc(x.id) + '"' + (x.llarga ? ' data-llarga="1"' : '') + ' aria-haspopup="dialog">' +
            '<span class="gravat">' + esc(curta(x.data) + ' · ' + menaNom + (x.llarga ? ' · llarga' : '')) + '</span>' +
            '<span class="t">' + esc(x.titol || (x.mena === 'forca' ? 'Força' : 'Sortida')) + '</span>' +
            '<span class="m">' + esc([x.km ? coma(x.km, 1) + ' km' : '',
               x.desnivell ? mil(x.desnivell) + ' m D+' : '',
               x.minuts ? hores(x.minuts) : ''].filter(Boolean).join(' · ') || 'sense xifres') + '</span>' +
            /* UNA SESSIÓ DE FORÇA NO TÉ QUILÒMETRES D'ESFORÇ i posar-hi un
               guionet és ocupar la columna amb un no-res. Els minuts sí que
               en diuen alguna cosa, i és el que la fa comparable amb les
               altres sessions de força. */
            '<span class="ke">' + (x.kmEsforc === null
              ? (x.minuts ? Math.round(x.minuts) : '—') + '<small>min</small>'
              : coma(x.kmEsforc, 1) + '<small>km-e</small>') + '</span>' +
          '</button></li>';
        }).join('') + '</ul>' +
      '</section>';
    }

    function thisMonday() {
      var x = new Date(d.avui + 'T12:00:00');
      var dia = x.getDay() === 0 ? 7 : x.getDay();
      x.setDate(x.getDate() - (dia - 1));
      return x.toISOString().slice(0, 10);
    }

    // ═══════════════════════════════════════════════════════════ LA CAPTURA
    /* TRES MENES DE CAPTURA I UNA SOLA PORTA. Es tria primer què és, perquè
       el que se li demana al model no és igual: d'una llista de Strava en surt
       una sessió per fila, i de l'informe del rellotge en surt un sol número. */
    function obreCaptura() {
      var cos = App.modal('Passa una captura',
        '<div class="formulari">' +
          '<p class="menut">Es llegeix la imatge i et dic què hi he vist. No es desa res ' +
            'fins que ho confirmis: una lectura d\'una pantalla s\'equivoca, i una xifra ' +
            'inventada dins de la sèrie és pitjor que un forat.</p>' +
          '<label class="btn btn-ple">' + ic('entrenaments') +
            'Llista d\'entrenaments (Strava)' +
            '<input type="file" accept="image/*" hidden data-cap="trail"></label>' +
          '<label class="btn btn-ple">' + ic('h-forca') +
            'App de força' +
            '<input type="file" accept="image/*" hidden data-cap="forca"></label>' +
          '<label class="btn btn-ple">' + ic('h-petjada') +
            'Informe de passos del rellotge' +
            '<input type="file" accept="image/*" hidden data-cap="passos"></label>' +
        '</div>');

      cos.querySelectorAll('[data-cap]').forEach(function (inp) {
        inp.addEventListener('change', function () {
          var f = inp.files && inp.files[0];
          if (!f) return;
          var mena = inp.dataset.cap;
          cos.innerHTML = '<div class="formulari">' +
            '<p class="menut">Llegint la captura…</p>' +
            '<div class="esquelet" style="height:120px"></div></div>';
          redueix(f).then(function (dataUrl) {
            return crida('entrenaments', 'llegeixCaptura',
              { contingut: dataUrl, mena: mena, dilluns: d.dilluns });
          }).then(function (r) {
            if (r.mena === 'passos') proposaPassos(r);
            else proposaSessions(r);
          }).catch(function (err) {
            App.tancaModal();
            App.brindis(err.message, 'error');
          });
        });
      });
    }

    /* LA PROPOSTA. Cada fila es pot treure i la data es pot corregir: són les
       dues coses que la lectura falla, i les dues que fan mal si passen. */
    function proposaSessions(r) {
      var l = r.sessions;
      var cos = App.modal('He llegit ' + l.length + (l.length === 1 ? ' sessió' : ' sessions'),
        '<form class="formulari" id="f-prop">' +
          (r.avis ? '<div class="avis">' + ic('avis') + '<div>' + esc(r.avis) + '</div></div>' : '') +
          '<p class="menut">Repassa-ho i treu el que no vagi bé. El que deixis marcat és el ' +
            'que es desarà.</p>' +
          l.map(function (s, i) {
            return '<div class="prop' + (s.dubtosa ? ' prop-dubte' : '') + '">' +
              '<label class="prop-cap">' +
                '<input type="checkbox" data-tria="' + i + '"' + (s.data ? ' checked' : '') + '>' +
                '<span><b>' + esc(s.titol || (s.mena === 'forca' ? 'Força' : 'Sortida')) + '</b>' +
                '<span class="menut">' + esc([
                    s.km ? coma(s.km, 1) + ' km' : '',
                    s.desnivell ? Math.round(s.desnivell) + ' m D+' : '',
                    s.minuts ? hores(s.minuts) : '',
                    s.kmEsforc !== null ? coma(s.kmEsforc, 1) + ' km-esforç' : ''
                  ].filter(Boolean).join(' · ') || 'sense xifres') + '</span></span>' +
              '</label>' +
              /* SENSE `required`, I A POSTA. Amb l'atribut, una fila que has
                 DESMARCAT perquè no la vols bloquejava el desat de tota la
                 resta: el navegador no deixa enviar el formulari i no diu per
                 què d'una manera que es pugui entendre. Aquí la comprovació la
                 fa el codi, que sap quines files compten. */
              '<input class="entrada" type="date" data-dia="' + i + '" value="' +
                esc(s.data || '') + '">' +
              (s.dubtosa ? '<p class="menut dubte">' + esc(s.data
                  ? 'Aquest dia cau fora de la setmana que estàs important. Comprova\'l.'
                  : 'No he sabut veure quin dia era. Posa-l\'hi tu.') + '</p>' : '') +
            '</div>';
          }).join('') +
          '<div class="desa-fix"><button class="btn btn-primari btn-ple" type="submit">Desa el que he marcat</button></div>' +
        '</form>');

      cos.querySelector('#f-prop').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var tria = [], falta = null;
        l.forEach(function (s, i) {
          if (!cos.querySelector('[data-tria="' + i + '"]').checked) return;
          var camp = cos.querySelector('[data-dia="' + i + '"]');
          /* MARCADA I SENSE DIA: es para i es diu quina. Deixar-la caure en
             silenci seria pitjor que l'error, perquè te'n vas convençut que
             s'ha desat tot. */
          if (!camp.value) { if (!falta) falta = { camp: camp, titol: s.titol }; return; }
          tria.push({ data: camp.value, mena: s.mena, titol: s.titol, km: s.km,
                      desnivell: s.desnivell, minuts: s.minuts, pulsacions: s.pulsacions });
        });
        if (falta) {
          App.brindis('Falta el dia de «' + (falta.titol || 'una sessió') + '»', 'error');
          falta.camp.focus();
          return;
        }
        if (!tria.length) { App.brindis('No has deixat cap sessió marcada', 'error'); return; }

        var bt = cos.querySelector('button[type="submit"]');
        bt.disabled = true; bt.dataset.carregant = '1';
        crida('entrenaments', 'confirmaCaptura', { sessions: tria }).then(function (x) {
          App.tancaModal();
          App.brindis(x.desats + (x.desats === 1 ? ' sessió desada' : ' sessions desades'));
          carrega(true);
        }).catch(function (err) {
          bt.disabled = false; bt.dataset.carregant = '0';
          App.brindis(err.message, 'error');
        });
      });
    }

    function proposaPassos(r) {
      obrePassos(r.passos.total, r.passos.mitjana, r.avis);
    }

    function obrePassos(total, mitjana, avis) {
      var cos = App.modal('Passos de la setmana',
        '<form class="formulari" id="f-pas">' +
          (avis ? '<div class="avis">' + ic('avis') + '<div>' + esc(avis) + '</div></div>' : '') +
          '<div class="camp-fila dos"><div class="camp"><label for="p-total">Total</label>' +
            '<input class="entrada" id="p-total" type="number" min="0" inputmode="numeric" ' +
              'value="' + (total === null || total === undefined ? '' : total) + '"></div>' +
          '<div class="camp"><label for="p-mitjana">Al dia</label>' +
            '<input class="entrada" id="p-mitjana" type="number" min="0" inputmode="numeric" ' +
              'value="' + (mitjana === null || mitjana === undefined ? '' : mitjana) + '">' +
            '</div></div>' +
          '<p class="menut">El total de la setmana o la mitjana al dia: amb una de les dues n\'hi ha prou, l\'altra surt sola.</p>' +
          '<button class="btn btn-primari btn-ple" type="submit">Desa els passos</button>' +
        '</form>');

      cos.querySelector('#f-pas').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var bt = cos.querySelector('button[type="submit"]');
        bt.disabled = true; bt.dataset.carregant = '1';
        var buit = function (id) {
          var v = cos.querySelector(id).value.trim();
          return v === '' ? null : Number(v);
        };
        crida('entrenaments', 'desaPassos', {
          dilluns: d.dilluns, total: buit('#p-total'), mitjana: buit('#p-mitjana'),
          font: total !== null && total !== undefined ? 'captura' : 'ma'
        }).then(function () {
          App.tancaModal();
          App.brindis('Passos desats');
          carrega(true);
        }).catch(function (err) {
          bt.disabled = false; bt.dataset.carregant = '0';
          App.brindis(err.message, 'error');
        });
      });
    }

    // ------------------------------------------------------- una sessió a mà
    function obreSessio(s) {
      var v = s || { data: d.avui, mena: 'trail', titol: '', km: null,
                     desnivell: null, minuts: null, kcal: null, pulsacions: null, notes: '' };
      var val = function (x) { return x === null || x === undefined ? '' : x; };

      var cos = App.modal(s ? 'Entrenament del ' + curta(v.data) : 'Entrenament nou',
        '<form id="f-ent" class="formulari" novalidate>' +
          '<div class="camp"><label for="e-data">Dia</label>' +
            '<input class="entrada" id="e-data" type="date" value="' + esc(v.data) + '" required></div>' +

          '<div class="camp" role="group" aria-labelledby="e-mena"><span id="e-mena">Mena</span><div class="tria-fila">' +
            [['trail', 'Trail'], ['forca', 'Força'], ['altre', 'Altre']].map(function (m) {
              return '<button type="button" class="tria-bt" data-mena="' + m[0] + '"' +
                ' aria-pressed="' + (v.mena === m[0] ? 'true' : 'false') + '">' + m[1] + '</button>';
            }).join('') + '</div></div>' +

          '<div class="camp"><label for="e-titol">Com se\'n diu</label>' +
            '<input class="entrada" id="e-titol" type="text" autocomplete="off" ' +
              'value="' + esc(v.titol || '') + '" placeholder="Matinal al Montseny"></div>' +

          '<div class="camp-fila">' +
            '<div class="camp"><label for="e-km">Km</label>' +
              '<input class="entrada" id="e-km" type="text" inputmode="decimal" ' +
                'pattern="[0-9]+([.,][0-9]+)?" value="' + esc(String(val(v.km))) + '"></div>' +
            '<div class="camp"><label for="e-des">Desnivell</label>' +
              '<input class="entrada" id="e-des" type="number" min="0" max="12000" ' +
                'inputmode="numeric" value="' + esc(String(val(v.desnivell))) + '"></div>' +
            '<div class="camp"><label for="e-min">Minuts</label>' +
              '<input class="entrada" id="e-min" type="number" min="0" max="1440" ' +
                'inputmode="numeric" value="' + esc(String(val(v.minuts))) + '"></div>' +
          '</div>' +
          '<p class="menut" style="margin-top:calc(-1 * var(--e2))">El desnivell és el ' +
            'positiu, el que has pujat. És el que fa que una sortida compti el que compta.</p>' +

          /* EL QUE DIU EL RELLOTGE, PER SI EL VOLS GUARDAR. No compta per a
             la càrrega, però ja hi era al full i el formulari no el deixava
             escriure: en corregir una sessió a mà, a més, se l'esborrava. */
          '<div class="camp-fila dos">' +
            '<div class="camp"><label for="e-kcal">Kcal</label>' +
              '<input class="entrada" id="e-kcal" type="number" min="0" max="20000" ' +
                'inputmode="numeric" value="' + esc(String(val(v.kcal))) + '"></div>' +
            '<div class="camp"><label for="e-pul">Pulsacions</label>' +
              '<input class="entrada" id="e-pul" type="number" min="30" max="230" ' +
                'inputmode="numeric" value="' + esc(String(val(v.pulsacions))) + '"></div>' +
          '</div>' +
          '<p class="menut" style="margin-top:calc(-1 * var(--e2))">Les pulsacions, la mitjana de la sessió.</p>' +

          '<div class="camp"><label for="e-notes">Notes</label>' +
            '<textarea class="entrada" id="e-notes" rows="2">' + esc(v.notes || '') + '</textarea></div>' +

          '<div class="desa-fix"><p class="camp-mal" id="e-mal" role="alert" hidden></p>' +
          '<button class="btn btn-primari btn-ple" type="submit">' +
            (s ? 'Desa els canvis' : 'Desa l\'entrenament') + '</button></div>' +
          (s ? '<button class="btn btn-perill btn-ple" type="button" data-fora="1">' +
               'Treu-lo</button>' : '') +
        '</form>');

      var mena = v.mena;
      cos.querySelectorAll('[data-mena]').forEach(function (b) {
        b.addEventListener('click', function () {
          mena = b.dataset.mena;
          cos.querySelectorAll('[data-mena]').forEach(function (x) {
            x.setAttribute('aria-pressed', x.dataset.mena === mena ? 'true' : 'false');
          });
        });
      });

      var fora = cos.querySelector('[data-fora]');
      if (fora) fora.addEventListener('click', function () {
        /* El calendari i les fotos ho pregunten; això també ha de fer-ho. */
        App.confirma('Treure aquest entrenament?',
          '<p>' + esc(s.titol || 'Sense títol') + '</p>' +
          '<p class="menut">Se n va del full i deixa de comptar a la càrrega de la setmana.</p>',
          'Sí, treu-lo',
          function (b) {
            crida('entrenaments', 'esborra', { id: s.id }).then(function () {
              App.tancaModal(); App.brindis('Entrenament tret'); carrega(true);
            }).catch(function (err) {
              b.disabled = false;
              App.brindis(err.message, 'error');
            });
          });
      });

      var mal = cos.querySelector('#e-mal');
      cos.querySelector('#f-ent').addEventListener('submit', function (ev) {
        ev.preventDefault();
        mal.hidden = true;
        var bt = cos.querySelector('button[type="submit"]');
        if (!cos.querySelector('#e-data').value) {
          mal.textContent = 'Falta el dia de l\'entrenament.'; mal.hidden = false;
          cos.querySelector('#e-data').focus();
          return;
        }
        var km = cos.querySelector('#e-km').value.trim();
        if (km !== '' && !/^[0-9]+([.,][0-9]+)?$/.test(km)) {
          mal.textContent = 'Els quilòmetres han de ser un número, com 14,6.'; mal.hidden = false;
          cos.querySelector('#e-km').focus();
          return;
        }
        bt.disabled = true; bt.dataset.carregant = '1';
        var buit = function (id) {
          var x = cos.querySelector(id).value.trim();
          return x === '' ? null : Number(x.replace(',', '.'));
        };
        crida('entrenaments', 'desa', {
          id: s ? s.id : null,
          data: cos.querySelector('#e-data').value,
          mena: mena,
          titol: cos.querySelector('#e-titol').value.trim(),
          km: buit('#e-km'), desnivell: buit('#e-des'), minuts: buit('#e-min'),
          kcal: buit('#e-kcal'), pulsacions: buit('#e-pul'),
          notes: cos.querySelector('#e-notes').value.trim(),
          font: s ? s.font : 'ma'
        }).then(function () {
          App.tancaModal(); App.brindis('Entrenament desat'); carrega(true);
        }).catch(function (err) {
          bt.disabled = false; bt.dataset.carregant = '0';
          mal.textContent = err.message; mal.hidden = false;
        });
      });
    }

    /* LES CAPTURES NO ES REDUEIXEN TANT COM LES FOTOS. Una foto del cos es
       compara de lluny i amb mil dos-cents píxels n'hi ha de sobra; d'una
       captura se n'ha de llegir un «1.482» sense confondre'l amb un «1482»,
       i a mil dos-cents píxels els números petits es desfan. */
    function redueix(fitxer) {
      return new Promise(function (ok, no) {
        var lector = new FileReader();
        lector.onerror = function () { no(new Error('No he pogut llegir la imatge.')); };
        lector.onload = function () {
          var img = new Image();
          img.onerror = function () { no(new Error('Això no sembla una imatge.')); };
          img.onload = function () {
            var MAX = 1600;
            var e = Math.min(1, MAX / Math.max(img.width, img.height));
            var c = document.createElement('canvas');
            c.width = Math.round(img.width * e); c.height = Math.round(img.height * e);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            ok(c.toDataURL('image/jpeg', 0.92));
          };
          img.src = lector.result;
        };
        lector.readAsDataURL(fitxer);
      });
    }

    // ------------------------------------------------------------------ lliga
    function lliga() {
      var t = arrel.querySelector('[data-torna]');
      if (t) t.addEventListener('click', function () { App.ves('inici'); });

      arrel.querySelectorAll('[data-set]').forEach(function (b) {
        var ves = function () {
          if (b.disabled) return;
          dilluns = b.dataset.set;
          carrega(true);
        };
        b.addEventListener('click', ves);
        /* Els filets de les dotze setmanes són dibuix, no botons de debò:
           el teclat hi ha d'arribar igual. */
        if (b.tagName.toLowerCase() === 'g') b.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ves(); }
        });
      });

      arrel.querySelectorAll('[data-captura]').forEach(function (b) {
        b.addEventListener('click', obreCaptura);
      });

      var n = arrel.querySelector('[data-nou]');
      if (n) n.addEventListener('click', function () { obreSessio(null); });

      var p = arrel.querySelector('[data-passos]');
      if (p) p.addEventListener('click', function () {
        var pa = d.setmana.passos;
        obrePassos(pa ? pa.total : null, pa ? pa.mitjana : null, '');
      });

      arrel.querySelectorAll('[data-obre]').forEach(function (b) {
        b.addEventListener('click', function () {
          var s = d.setmana.llista.filter(function (x) { return x.id === b.dataset.obre; })[0];
          if (s) obreSessio(s);
        });
      });
    }

    // ----------------------------------------------------------------- càrrega
    function carrega(refresca) {
      var clau = 'entrenaments' + (dilluns ? '.' + dilluns : '');
      var cau = Cau.get(clau, null);
      if (cau && !refresca) { d = cau; pinta(); }
      else if (!cau) arrel.innerHTML = Comp.carregant(3);

      crida('entrenaments', 'pantalla', { desde: dilluns }).then(function (r) {
        d = r; dilluns = r.dilluns;
        Cau.set('entrenaments.' + r.dilluns, r);
        pinta();
      }).catch(function (err) {
        if (d) { App.brindis('Sense connexió: dades del telèfon', 'error'); return; }
        arrel.innerHTML = Comp.error(err, true);
      });
    }

    carrega(false);
  }
});
</script>
