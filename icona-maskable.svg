    Variant «maskable» per a Android. El sistema retalla la icona amb la forma
    que vol —cercle, gota, quadrat arrodonit— i el que surti de la zona segura
    (el cercle central del 80 %) es perd. Per això el fons va a sang i el
    dibuix es redueix al 72 % i es centra: passi el que passi, el cim i les
    espatlles no es tallen.
  -->
