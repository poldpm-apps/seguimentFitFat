<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="El cos">
  <title>El cos</title>
  <!--
    CAP, COLL I ESPATLLES. Una carena que és un bust, perquè el català ja
    anomena així les parts d'una muntanya. Al darrere, les carenes de setmanes
    anteriors, més amples i més clares: el cos d'abans, que s'allunya com una
    serralada. El color va de la vall al cim —clar el que és vell, fosc el
    d'ara— amb la rampa del full topogràfic, i les cantonades són rectes: la
    forma del retall la posa el mòbil.
  -->
  <rect width="512" height="512" fill="#e8eef0"/>
  <g stroke="#086674" stroke-width="2" opacity=".14"><path d="M0 128h512M0 256h512M0 384h512M128 0v512M256 0v512M384 0v512"/></g>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M28.8 395.2 L112.7 266.8 L201.7 232.2 L216.5 202.5 L256 84 L295.5 202.5 L310.3 232.2 L399.3 266.8 L483.2 395.2" stroke="#bcced4" stroke-width="8"/>
    <path d="M46.2 395.2 L123.8 276.6 L205.8 244.7 L219.5 217.4 L256 107.9 L292.5 217.4 L306.2 244.7 L388.2 276.6 L465.8 395.2" stroke="#7ab5c1" stroke-width="9"/>
    <path d="M63.7 395.2 L134.8 286.5 L210 257.3 L222.6 232.2 L256 131.9 L289.4 232.2 L302 257.3 L377.2 286.5 L448.3 395.2" stroke="#1c8496" stroke-width="10"/>
    <path d="M81.2 395.2 L145.8 296.4 L214.2 269.8 L225.6 247 L256 155.8 L286.4 247 L297.8 269.8 L366.2 296.4 L430.8 395.2" stroke="#054a57" stroke-width="18"/>
  </g>
  <path d="M39.4 395.2H472.6" stroke="#0d191e" stroke-width="12"/>
</svg>
